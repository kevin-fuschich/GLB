name: GLB Stat Preview

on:
  push:
    branches:
      - glb-stat-backbone
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate unique player identities
        run: node tools/validate-roster-uniqueness.js

      - name: Generate deterministic preview
        run: node tools/generate-season-v3.js

      - name: Recalculate pitching decisions
        run: node tools/assign-pitching-decisions.js

      - name: Build player population layer
        run: node tools/build-player-population.js

      - name: Apply persistent league identities
        run: node tools/apply-league-identities.js

      - name: Build public player stat views
        run: node tools/build-public-stat-views.js

      - name: Validate population completeness
        run: node tools/validate-population-layer.js

      - name: Validate preview reconciliation
        run: node tools/validate-stat-preview.js

      - name: Analyze statistical environment
        run: node tools/analyze-stat-preview.js

      - name: Show generated files
        run: find data/generated-preview -maxdepth 2 -type f -print

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: glb-stat-preview
          path: data/generated-preview/
          if-no-files-found: error
