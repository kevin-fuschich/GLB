name: GLB Stat Preview

on:
  push:
    branches:
      - glb-stat-backbone
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate unique player identities
        run: node tools/validate-roster-uniqueness.js

      - name: Generate deterministic preview
        run: node tools/generate-season-v2.js

      - name: Analyze statistical environment
        run: node tools/analyze-stat-preview.js

      - name: Show generated files
        run: find data/generated-preview -maxdepth 2 -type f -print

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: glb-stat-preview
          path: data/generated-preview/
          if-no-files-found: error
