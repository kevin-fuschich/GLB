<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GLB — Office of League Records</title>

<style>

:root{
  --navy:#0b1e33;
  --blue:#1d4f91;
  --border:#d9dee5;
  --bg:#f3f5f7;
  --card:#ffffff;
  --text:#111111;
  --muted:#5f6b7a;
  --light:#dfe7f1;
  --max:1280px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
}

a{
  color:inherit;
  text-decoration:none;
}

img{
  display:block;
  max-width:100%;
}

.container{
  max-width:var(--max);
  margin:0 auto;
  padding:0 20px;
}

/* HEADER */

.site-header{
  background:var(--navy);
  color:#fff;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.topbar{
  min-height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
}

.brand-mark{
  font-weight:800;
  letter-spacing:1.4px;
  font-size:24px;
}

.brand-sub{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1.2px;
  color:var(--light);
}

.nav-links{
  display:flex;
  align-items:center;
  justify-content:center;
  flex:1;
}

.nav-links a{
  color:rgba(255,255,255,.92);
  padding:26px 16px 22px;
  font-size:13px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.8px;
  border-bottom:4px solid transparent;
}

.nav-links a.active{
  border-bottom-color:#7fb0ff;
}

.header-meta{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1px;
  color:var(--light);
}

/* HERO */

.hero{
  padding:54px 0 34px;
}

.hero h1{
  margin:0 0 12px;
  font-size:52px;
  line-height:1;
}

.hero p{
  max-width:760px;
  margin:0;
  color:var(--muted);
  line-height:1.6;
  font-size:16px;
}

/* ARTIFACTS */

.artifact-grid{
  display:grid;
  gap:26px;
  padding-bottom:60px;
}

.artifact{
  display:grid;
  grid-template-columns:420px 1fr;
  background:#fff;
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
}

.scan{
  background:#e9edf2;
  min-height:360px;
}

.scan img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.artifact-body{
  padding:28px;
}

.artifact-body h2{
  margin:0 0 18px;
  font-size:30px;
  line-height:1.1;
}

.meta{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  margin-bottom:24px;
}

.meta div{
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px;
  background:#fafbfd;
}

.meta span{
  display:block;
  margin-bottom:6px;
  font-size:10px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--muted);
}

.meta strong{
  font-size:14px;
}

.notes{
  color:#2d3742;
  line-height:1.7;
  margin:0 0 20px;
}

.status{
  display:inline-block;
  padding:10px 14px;
  border-radius:999px;
  background:#eef4ff;
  color:#1d4f91;
  font-size:12px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.08em;
}

/* FOOTER */

.site-footer{
  margin-top:40px;
  background:#0b1e33;
  color:#dfe7f1;
}

.footer-main{
  display:grid;
  grid-template-columns:1.6fr 1fr 1fr 1fr;
  gap:40px;
  padding:46px 20px;
}

.footer-logo{
  font-weight:800;
  font-size:26px;
  letter-spacing:1.4px;
  margin-bottom:8px;
}

.footer-tag{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1px;
  color:#9fb6d1;
  margin-bottom:14px;
}

.footer-desc{
  margin:0;
  color:#b8c
