<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GLB Box Score | Global League Baseball</title>
  <link rel="stylesheet" href="season.css?v=20260914teamlinks" />
  <style>
    :root{--navy:#0b1e33;--navy-2:#102843;--light-text:#dfe7f1;--white:#fff;--max:1280px}
    .container{max-width:var(--max);margin:0 auto;padding:0 20px}
    .site-header{background:var(--navy);color:var(--white);border-bottom:1px solid rgba(255,255,255,.08);position:sticky;top:0;z-index:1000;padding:0}
    .topbar{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px}
    .brand{display:flex;align-items:center;gap:14px;min-width:0;flex-shrink:0}
    .brand-mark{font-weight:800;letter-spacing:1.4px;font-size:24px;line-height:1}
    .brand-sub{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--light-text);white-space:nowrap}
    .nav-links{display:flex;align-items:center;gap:0;flex:1;justify-content:center;min-width:0}
    .site-header .nav-links a{color:rgba(255,255,255,.92);padding:26px 16px 22px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;border-bottom:4px solid transparent;white-space:nowrap}
    .site-header .nav-links a:hover{background:rgba(255,255,255,.04)}
    .site-header .nav-links a.active{border-bottom-color:#7fb0ff}
    .header-right{display:flex;align-items:center;gap:16px;flex-shrink:0}
    .header-meta{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--light-text);white-space:nowrap}
    .nav-toggle{display:none;appearance:none;border:0;background:none;color:#fff;font-size:24px;cursor:pointer;padding:8px 0 8px 8px}
    .mobile-menu{display:none;background:var(--navy-2);border-top:1px solid rgba(255,255,255,.08)}
    .site-header .mobile-menu a{display:block;padding:16px 20px;color:#fff;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;border-top:1px solid rgba(255,255,255,.08)}
    .mobile-menu.open{display:block}
    .box-heading{margin:0 0 22px}
    .box-heading h1{font:2.3rem Georgia,serif;margin:0 0 4px}
    #game-title .team-page-link{border-bottom-color:rgba(29,79,145,.45)}
    @media(max-width:920px){.nav-links{display:none}.nav-toggle{display:block}.header-meta{display:none}}
    @media(max-width:680px){.container{padding:0 14px}.topbar{min-height:64px}.brand-mark{font-size:22px}.brand-sub{display:none}}
  </style>
</head>
<body data-season-page="box">
  <header class="site-header">
    <div class="container">
      <div class="topbar">
        <a href="index.html" class="brand" aria-label="Global League Baseball home">
          <div class="brand-mark">GLB</div><div class="brand-sub">Global League Baseball</div>
        </a>
        <nav class="nav-links" aria-label="Primary">
          <a href="index.html">Home</a><a href="scores.html" class="active">Scores</a><a href="standings.html">Standings</a><a href="schedule.html">Schedule</a><a href="teams.html">Teams</a><a href="players.html">Players</a><a href="stats.html">Stats</a><a href="news.html">News</a><a href="donk-championships.html">Events</a>
        </nav>
        <div class="header-right"><div class="header-meta">2026 Season</div><button class="nav-toggle" id="navToggle" aria-label="Open menu" aria-expanded="false" aria-controls="mobileMenu">☰</button></div>
      </div>
    </div>
    <nav class="mobile-menu" id="mobileMenu" aria-label="Mobile">
      <a href="index.html">Home</a><a href="scores.html" class="active">Scores</a><a href="standings.html">Standings</a><a href="schedule.html">Schedule</a><a href="teams.html">Teams</a><a href="players.html">Players</a><a href="stats.html">Stats</a><a href="news.html">News</a><a href="donk-championships.html">Events</a>
    </nav>
  </header>
  <main>
    <section class="box-heading" aria-labelledby="game-title"><h1 id="game-title">Box Score</h1><div id="as-of">Loading game…</div></section>
    <section class="panel"><h2>Linescore</h2><table><thead><tr id="inning-head"></tr></thead><tbody id="inning-body"></tbody></table></section>
    <section class="panel"><h2>Batting</h2><div id="batting"></div></section>
    <section class="panel"><h2>Pitching</h2><div id="pitching"></div></section>
  </main>
  <script>
    const navToggle=document.getElementById('navToggle');
    const mobileMenu=document.getElementById('mobileMenu');
    navToggle.addEventListener('click',()=>{const open=mobileMenu.classList.toggle('open');navToggle.setAttribute('aria-expanded',open?'true':'false')});
  </script>
  <script src="scripts/season-site.js?v=20260914teamlinks"></script>
<script src="scripts/glb-ticker.js"></script>\n</body>
</html>
