<title>Birmingham Vulcans – Club Portal</title>

<style>
:root{
  /* Birmingham Identity: Iron / Fire / Foundry */
  --primary: #2E2F33;   /* Foundry charcoal */
  --accent:  #F15A24;   /* Molten orange */
  --paper:   #ffffff;
  --ink:     #0f1214;

  --border-thick: 4px solid var(--ink);
  --border-thin:  1px solid #ccc;

  --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: "Courier New", Courier, monospace;
}

body{
  background: #f4f4f4;
  color: var(--ink);
  font-family: var(--sans);
  margin: 0;
  padding: 20px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.club-sheet{
  max-width: 900px;
  margin: 0 auto;
  background: var(--paper);
  padding: 40px;
  border-top: var(--border-thick);
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
  position: relative;
}

/* DOC ID */
.doc-id{
  position: absolute;
  top: 15px;
  right: 20px;
  font-family: var(--mono);
  font-size: 10px;
  color: #999;
  letter-spacing: 1px;
}

/* HEADER */
header{
  border-bottom: var(--border-thick);
  padding-bottom: 20px;
  margin-bottom: 20px;
}
