<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLB Team Record – Spokane Alloys</title>

<style>
:root{
  --paper:#ffffff;
  --ink:#0f1214;
  --meta:#666;
  --line:#e0e0e0;

  --sans:"Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono:"Courier New", Courier, monospace;
}

body{
  background:#f4f4f4;
  font-family:var(--sans);
  color:var(--ink);
  margin:0;
  padding:40px 20px;
}

.sheet{
  max-width:640px;
  margin:0 auto;
  background:var(--paper);
  padding:40px;
  border-top:5px solid var(--ink);
  box-shadow:0 4px 20px rgba(0,0,0,.08);
}

header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  padding-bottom:20px;
  border-bottom:2px solid var(--ink);
  margin-bottom:30px;
}

.header-text h1{
  margin:0 0 6px 0;
  font-size:22px;
  font-weight:900;
  text-transform:uppercase;
}

.header-meta{
  font-size:13px;
  color:var(--meta);
}

.team-logo{
  height:120px;
  width:auto;
}

.team-photo{
  margin:30px 0;
  border:1px solid var(--line);
}

.team-photo img{
  width:100%;
  display:block;
}

h2{
  font-family:var(--mono);
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:.5px;
  margin:40px 0 12px;
  padding-bottom:6px;
  border-bottom:1px solid var(--line);
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}

th{
  font-size:11px;
  color:var(--meta);
  font-weight:600;
  text-transform:uppercase;
  padding:6px;
  border-bottom:2px solid var(--ink);
}

td{
  padding:8px 6px;
  border-bottom:1px solid #f0f0f0;
}

.align-center{ text-align:center; }
.align-right{ text-align:right; }

.roster-pic{
  width:48px;
  height:48px;
  object-fit:cover;
  border-radius:6px;
  border:1px solid var(--line);
  display:block;
  background:#f0f0f0;
}

footer{
  margin-top:50px;
  padding-top:18px;
  border-top:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-family:var(--mono);
  font-size:10px;
  color:#777;
}

.glb-logo{
  height:56px;
  width:auto;
}
</style>
</head>

<body>
<div class="sheet">

<header>
  <div class="header-text">
    <h1 id="team-name">Spokane Alloys</h1>
    <div class="header-meta">Spokane — Americas Division</div>
    <div class="header-meta">Team Record & Active Roster</div>
  </div>

  <img src="team-spokane-alloys-logo.png" alt="Spokane Alloys Logo" class="team-logo">
</header>

<div class="team-photo">
  <img src="team-spokane-alloys-photo.png" alt="Spokane Alloys Team Photo">
</div>

<h2>Season Snapshot</h2>
<table>
  <thead>
    <tr>
      <th>Record</th>
      <th>Runs</th>
      <th>Allowed</th>
      <th>Diff</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>—</td>
      <td>—</td>
      <td>—</td>
      <td>—</td>
    </tr>
  </tbody>
</table>

<h2>Active Roster</h2>
<table>
  <thead>
    <tr>
      <th>Pic</th>
      <th>Player</th>
      <th>Pos</th>
      <th class="align-center">B/T</th>
      <th class="align-right">Age</th>
    </tr>
  </thead>
  <tbody id="roster-body"></tbody>
</table>

<h2>Recent Games</h2>
<table>
  <thead>
    <tr>
      <th>Date</th>
      <th>Opponent</th>
      <th>Result</th>
      <th class="align-right">Box</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>Apr 8</td>
      <td>Fresno Yield</td>
      <td>W 2–0</td>
      <td class="align-right"><a href="boxscore.html">View</a></td>
    </tr>
  </tbody>
</table>

<footer>
  <div>GLOBAL LEAGUE BASEBALL · TEAM RECORD</div>
  <img src="GLB_white.png" alt="GLB" class="glb-logo">
</footer>

</div>

<script>
async function loadRoster() {
  try {
    const response = await fetch('data/rosters/spokane-alloys.json');
    const data = await response.json();

    document.getElementById('team-name').textContent = data.team;

    const rosterBody = document.getElementById('roster-body');
    rosterBody.innerHTML = '';

    data.players.forEach(player => {
      const row = document.createElement('tr');

      row.innerHTML = `
        <td>
          <img
            class="roster-pic"
            src="assets/images/players/spokane-alloys/${player.photo}"
            alt="${player.name}"
            loading="lazy"
          >
        </td>
        <td>${player.name}</td>
        <td>${player.position}</td>
        <td class="align-center">${player.bats}/${player.throws}</td>
        <td class="align-right">${player.age}</td>
      `;

      rosterBody.appendChild(row);
    });
  } catch (error) {
    console.error('Failed to load roster:', error);
    document.getElementById('roster-body').innerHTML =
      '<tr><td colspan="5">Roster unavailable.</td></tr>';
  }
}

loadRoster();
</script>

</body>
</html>
