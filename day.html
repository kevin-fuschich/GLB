<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLB — Daily Scores</title>

<style>
:root{
  --ink:#0f1214;
  --paper:#ffffff;
  --border:4px solid var(--ink);
  --mono:"Courier New", Courier, monospace;
  --sans:"Helvetica Neue", Helvetica, Arial, sans-serif;
}

body{
  background:#f4f4f4;
  margin:0;
  padding:20px;
  color:var(--ink);
  font-family:var(--sans);
}

.sheet{
  max-width:900px;
  margin:0 auto;
  background:var(--paper);
  padding:40px;
  border-top:var(--border);
}

header{
  border-bottom:var(--border);
  padding-bottom:20px;
  margin-bottom:30px;
}

h1{
  margin:0;
  font-size:28px;
  text-transform:uppercase;
}

.date-line{
  margin-top:8px;
  font-family:var(--mono);
  font-size:12px;
  color:#666;
}

.game{
  padding:18px 0;
  border-bottom:1px solid #ddd;
  display:grid;
  grid-template-columns: 1fr auto;
  gap:10px;
}

.teams{
  font-weight:bold;
}

.score{
  font-family:var(--mono);
}

.note{
  margin-top:40px;
  font-family:var(--mono);
  font-size:11px;
  color:#777;
}
</style>
</head>

<body>

<div class="sheet">

<header>
  <h1>Daily Scores</h1>
  <div class="date-line" id="dateLine"></div>
</header>

<div id="games"></div>

<div class="note">
  GLOBAL LEAGUE BASEBALL · DAILY RECORD
</div>

</div>

<script>
/* DATE HANDLING — SAFE DEFAULT */
const params = new URLSearchParams(window.location.search);
let date = params.get("date");

if (!date) {
  const today = new Date();
  date = today.toISOString().slice(0,10);
}

/* DISPLAY DATE */
document.getElementById("dateLine").textContent =
  `Games for ${date}`;

/* PLACEHOLDER DATA (REMOVE LATER) */
const sampleGames = [
  { away: "Spokane Alloys", home: "Fresno Yield", score: "3–2" },
  { away: "Albuquerque Aeros", home: "Tijuana Técnicos", score: "6–5" },
  { away: "St. Paul Frost", home: "Birmingham Vulcans", score: "1–0" }
];

const container = document.getElementById("games");

sampleGames.forEach(g => {
  const row = document.createElement("div");
  row.className = "game";
  row.innerHTML = `
    <div class="teams">${g.away} @ ${g.home}</div>
    <div class="score">${g.score}</div>
  `;
  container.appendChild(row);
});
</script>

</body>
</html>
