<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLB Daily Scores</title>

<style>
:root{
  --primary:#4A5863;
  --accent:#C0442C;
  --paper:#ffffff;
  --ink:#0f1214;

  --border-thick:4px solid var(--ink);
  --border-thin:1px solid #ccc;

  --sans:"Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono:"Courier New", Courier, monospace;
}

body{
  background:#f4f4f4;
  color:var(--ink);
  font-family:var(--sans);
  margin:0;
  padding:20px;
}

.page{
  max-width:900px;
  margin:0 auto;
  background:var(--paper);
  padding:40px;
  border-top:var(--border-thick);
  position:relative;
}

/* HEADER */
header{
  border-bottom:var(--border-thick);
  padding-bottom:20px;
  margin-bottom:25px;
}

h1{
  margin:0;
  font-size:32px;
  font-weight:900;
  text-transform:uppercase;
}

/* RETURN BAR */
.returnbar{
  margin:20px 0 35px;
  font-family:var(--mono);
  font-size:11px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.returnbar a{
  color:var(--ink);
  text-decoration:none;
  border-bottom:1px solid rgba(0,0,0,0.25);
}

.returnbar a:hover{
  color:var(--accent);
  border-bottom-color:var(--accent);
}

/* DATE STRIP */
.date-strip{
  font-family:var(--mono);
  font-size:12px;
  color:#666;
  margin-bottom:25px;
}

/* SCORES */
.scoreboard{
  border-top:var(--border-thin);
}

.game{
  padding:18px 0;
  border-bottom:var(--border-thin);
  display:grid;
  grid-template-columns: 1fr auto 1fr;
  gap:15px;
  align-items:center;
}

.team{
  font-weight:bold;
}

.score{
  font-family:var(--mono);
  font-size:14px;
}

/* FOOTER (MATCHES CLUB PAGES) */
footer{
  margin-top:70px;
  padding:30px 20px;
  border-top:var(--border-thick);
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-family:var(--mono);
  font-size:11px;
  color:#777;
}

.glb-logo{
  height:56px;
  width:auto;
}

@media(max-width:600px){
  .game{ grid-template-columns:1fr; text-align:center; }
  footer{ flex-direction:column; gap:15px; }
}
</style>
<link rel="stylesheet" href="site-header.css?v=20261112">
<script defer src="scripts/site-header.js?v=20261112"></script>
</head>

<div class="page">

<header>
  <h1>Daily Scores</h1>
</header>

<nav class="returnbar">
  <a href="javascript:history.back()">← Back</a>
  <a href="index.html">Teams Index</a>
</nav>

<div class="date-strip" id="dateDisplay"></div>

<section class="scoreboard" id="scoreboard">
  <!-- Games injected here -->
</section>

<footer>
  <div>GLOBAL LEAGUE BASEBALL · DAILY SCORES</div>
  <img class="glb-logo" src="GLB_white.png" alt="GLB">
</footer>

<script>
/* --- DATE HANDLING --- */
const params = new URLSearchParams(window.location.search);
let date = params.get("date");

if (!date) {
  const today = new Date();
  date = today.toISOString().slice(0,10); // YYYY-MM-DD
}

document.getElementById("dateDisplay").textContent =
  `Games for ${date}`;

/* --- PLACEHOLDER SCORE DATA ---
   Replace later with real data source
*/
const games = [
  { away:"Spokane Alloys", awayScore:4, home:"Fresno Yield", homeScore:6 },
  { away:"Albuquerque Aeros", awayScore:2, home:"Birmingham Vulcans", homeScore:3 }
];

const board = document.getElementById("scoreboard");

games.forEach(g => {
  const div = document.createElement("div");
  div.className = "game";
  div.innerHTML = `
    <div class="team">${g.away}</div>
    <div class="score">${g.awayScore} – ${g.homeScore}</div>
    <div class="team">${g.home}</div>
  `;
  board.appendChild(div);
});
</script>
