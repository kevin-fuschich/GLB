<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLB Daily Scores</title>

<style>
:root{
  --ink:#0f1214;
  --paper:#ffffff;
  --border-thick:4px solid var(--ink);
  --sans:"Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono:"Courier New", Courier, monospace;
}

body{
  background:#f4f4f4;
  margin:0;
  padding:20px;
  font-family:var(--sans);
  color:var(--ink);
}

.page{
  max-width:900px;
  margin:0 auto;
  background:var(--paper);
  padding:40px;
  border-top:var(--border-thick);
}

h1{
  margin-top:0;
  font-size:28px;
  text-transform:uppercase;
}

.notice{
  font-family:var(--mono);
  font-size:13px;
  color:#555;
  margin-top:30px;
}

footer{
  margin-top:70px;
  padding:30px 20px;
  border-top:var(--border-thick);
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-family:var(--mono);
  font-size:11px;
  color:#777;
}

.glb-logo{
  height:56px;
  width:auto;
}

@media(max-width:600px){
  footer{flex-direction:column; gap:15px;}
}
</style>
</head>

<body>
<div class="page">

<h1>Daily Scores</h1>

<div class="notice" id="date-line"></div>

<div class="notice">
  Scores will appear here once the daily log is wired.
</div>

<footer>
  <div>GLB LEAGUE RECORD · DAILY LOG</div>
  <img class="glb-logo" src="GLB_white.png" alt="GLB">
</footer>

</div>

<script>
const params = new URLSearchParams(window.location.search);
let date = params.get("date");

if (!date) {
  const today = new Date();
  date = today.toISOString().slice(0,10);
}

document.getElementById("date-line").textContent =
  "Date: " + date;
</script>

</body>
</html>
