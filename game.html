<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GLB — Game</title>

  <style>
    :root{
      color-scheme: light;
      --bg:#ffffff;
      --card:#ffffff;
      --ink:#111111;
      --muted:#5b6573;
      --line:rgba(17,17,17,.12);
      --max:1100px;
      --radius:18px;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      letter-spacing:.2px;
    }
    a{ color:inherit; text-decoration:none; }
    a:hover{ text-decoration:underline; text-underline-offset:3px; }

    .wrap{ max-width:var(--max); margin:0 auto; padding:28px 18px 56px; }

    .top{
      display:flex; align-items:center; justify-content:space-between;
      gap:18px; margin-bottom:18px;
    }
    .brand{ display:flex; align-items:center; gap:12px; }
    .logo{
      width:38px; height:38px; border-radius:12px;
      border:1px solid var(--line);
      display:grid; place-items:center;
      background:#f4f6f8;
      font-weight:900; letter-spacing:.6px;
    }
    .brand h1{
      font-size:14px; margin:0;
      color:var(--muted);
      font-weight:800;
      letter-spacing:.08em;
    }

    .nav{ display:flex; gap:14px; color:var(--muted); font-size:13px; }
    .nav a{ padding:8px 10px; border-radius:999px; border:1px solid transparent; }
    .nav a:hover{ border-color:var(--line); color:var(--ink); text-decoration:none; }

    .card{
      border:1px solid var(--line);
      background:var(--card);
      border-radius:var(--radius);
      padding:18px;
      margin-bottom:14px;
    }
    .card h2{
      margin:0 0 12px;
      font-size:14px;
      letter-spacing:.7px;
      text-transform:uppercase;
      color:var(--muted);
    }

    .headline{
      font-size:28px;
      font-weight:900;
      margin-bottom:6px;
    }
    .sub{
      color:var(--muted);
      font-size:13px;
      margin-bottom:12px;
    }

    table{
      width:100%;
      border-collapse:collapse;
      font-size:13px;
    }
    th, td{
      padding:9px 8px;
      border-bottom:1px solid var(--line);
      text-align:left;
    }
    th{
      color:var(--muted);
      font-weight:800;
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.6px;
    }
    tr:last-child td{ border-bottom:none; }

    .small{ color:var(--muted); font-size:12px; }

    @media (max-width: 860px){
      .headline{ font-size:22px; }
    }
  </style>
</head>

<body>
  <div class="wrap">

    <div class="top">
      <div class="brand">
        <div class="logo">GLB</div>
        <h1>GLOBAL LEAGUE BASEBALL</h1>
      </div>
      <div class="nav">
        <a href="./">Home</a>
        <a href="day.html?date=2026-04-08">Daily Scores</a>
        <a href="teams.html">Teams</a>
      </div>
    </div>

    <div class="card">
      <div class="headline" id="matchup">Loading…</div>
      <div class="sub" id="metaLine"></div>
    </div>

    <div class="card">
      <h2>Final Score</h2>
      <table>
        <thead>
          <tr><th>Team</th><th>R</th></tr>
        </thead>
        <tbody id="scoreRows"></tbody>
      </table>
    </div>

    <div class="card">
      <h2>Box Score</h2>
      <div class="small">(Full inning breakdown will live here.)</div>
    </div>

  </div>

<script>
  <script>
  const $ = (id) => document.getElementById(id);
  const qs = (name) => new URLSearchParams(location.search).get(name);

  async function loadJson(path){
    const res = await fetch(path + "?v=" + Date.now(), { cache: "no-store" });
    if(!res.ok) throw new Error("HTTP " + res.status + " for " + path);
    return res.json();
  }

  function pick(obj, keys){
    for(const k of keys){
      if(obj && obj[k] !== undefined && obj[k] !== null) return obj[k];
    }
    return undefined;
  }

  function pickPath(obj, path){
    try{
      return path.split(".").reduce((acc,k)=> (acc && acc[k] !== undefined) ? acc[k] : undefined, obj);
    }catch(e){ return undefined; }
  }

  function asTextTeam(v){
    // If it's already a string, great.
    if(typeof v === "string") return v;

    // If it's an object, try common name keys.
    if(v && typeof v === "object"){
      const name =
        pick(v, ["name","team","full","display","label","short","city","nickname"]) ||
        pickPath(v, "team.name") ||
        pickPath(v, "display.name");
      if(typeof name === "string") return name;

      // If object is {city, nickname}, build it.
      const city = pick(v, ["city"]);
      const nick = pick(v, ["nickname","nick"]);
      if(typeof city === "string" && typeof nick === "string") return `${city} ${nick}`;

      // Last resort: stringify a little
      return "[team]";
    }

    return "—";
  }

  function asScore(x){
    if(typeof x === "number") return x;
    if(typeof x === "string" && x.trim() !== "" && !isNaN(Number(x))) return Number(x);
    return "—";
  }

  (async function main(){
    try{
      const date = qs("date");
      const game = qs("game");
      if(!date || !game){
        $("matchup").textContent = "Missing query string";
        $("metaLine").textContent = "Use: ?date=YYYY-MM-DD&game=away@home";
        return;
      }

      const path = `data/games/${date}/${game}.json`;
      const g = await loadJson(path);

      // Team values may be objects OR strings depending on your schema
      const awayTeamVal =
        pick(g, ["away_team","awayTeam","away"]) ||
        pickPath(g, "teams.away") ||
        pickPath(g, "game.away") ||
        pickPath(g, "matchup.away");

      const homeTeamVal =
        pick(g, ["home_team","homeTeam","home"]) ||
        pickPath(g, "teams.home") ||
        pickPath(g, "game.home") ||
        pickPath(g, "matchup.home");

      const awayName = asTextTeam(awayTeamVal);
      const homeName = asTextTeam(homeTeamVal);

      const awayScoreVal =
        pick(g, ["away_score","awayScore"]) ||
        pickPath(g, "away.score") ||
        pickPath(g, "teams.away.runs") ||
        pickPath(g, "linescore.away.r") ||
        pickPath(g, "score.away");

      const homeScoreVal =
        pick(g, ["home_score","homeScore"]) ||
        pickPath(g, "home.score") ||
        pickPath(g, "teams.home.runs") ||
        pickPath(g, "linescore.home.r") ||
        pickPath(g, "score.home");

      const awayScore = asScore(awayScoreVal);
      const homeScore = asScore(homeScoreVal);

      const status = pick(g, ["status","game_status"]) || pickPath(g,"meta.status") || "Final";
      const attendanceRaw = pick(g, ["attendance"]) || pickPath(g,"meta.attendance") || pickPath(g,"game.attendance");
      const attendanceNum = Number(attendanceRaw);
      const attendanceTxt = Number.isFinite(attendanceNum) ? attendanceNum.toLocaleString() : "—";

      const gameDate = pick(g, ["date"]) || pickPath(g,"meta.date") || date;

      $("matchup").textContent = `${awayName} @ ${homeName}`;
      $("metaLine").textContent = `${gameDate} · Attendance ${attendanceTxt} · ${status}`;

      $("scoreRows").innerHTML = `
        <tr><td>${awayName}</td><td>${awayScore}</td></tr>
        <tr><td>${homeName}</td><td>${homeScore}</td></tr>
      `;

      document.title = `GLB — ${awayName} @ ${homeName}`;

    }catch(err){
      $("matchup").textContent = "Load failed";
      $("metaLine").textContent = err.message || String(err);
      console.error(err);
    }
  })();
</script>
</script>

</body>
</html>
