<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GLB — Game</title>

  <style>
    :root{
      color-scheme: light;
      --bg:#ffffff;
      --card:#ffffff;
      --ink:#111111;
      --muted:#5b6573;
      --line:rgba(17,17,17,.12);
      --max:1100px;
      --radius:18px;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      letter-spacing:.2px;
    }
    a{ color:inherit; text-decoration:none; }
    a:hover{ text-decoration:underline; text-underline-offset:3px; }

    .wrap{ max-width:var(--max); margin:0 auto; padding:28px 18px 56px; }

    .top{
      display:flex; align-items:center; justify-content:space-between;
      gap:18px; margin-bottom:18px;
    }
    .brand{ display:flex; align-items:center; gap:12px; }
    .logo{
      width:38px; height:38px; border-radius:12px;
      border:1px solid var(--line);
      display:grid; place-items:center;
      background:#f4f6f8;
      font-weight:900; letter-spacing:.6px;
    }
    .brand h1{
      font-size:14px; margin:0;
      color:var(--muted);
      font-weight:800;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    .nav{ display:flex; gap:14px; color:var(--muted); font-size:13px; }
    .nav a{ padding:8px 10px; border-radius:999px; border:1px solid transparent; }
    .nav a:hover{ border-color:var(--line); color:var(--ink); text-decoration:none; }

    .card{
      border:1px solid var(--line);
      background:var(--card);
      border-radius:var(--radius);
      padding:18px;
      margin-bottom:14px;
    }
    .card h2{
      margin:0 0 12px;
      font-size:14px;
      letter-spacing:.7px;
      text-transform:uppercase;
      color:var(--muted);
    }

    .headline{
      font-size:28px;
      font-weight:900;
      margin-bottom:6px;
    }
    .sub{
      color:var(--muted);
      font-size:13px;
      margin:0;
    }

    table{
      width:100%;
      border-collapse:collapse;
      font-size:13px;
    }
    th, td{
      padding:9px 8px;
      border-bottom:1px solid var(--line);
      text-align:left;
    }
    th{
      color:var(--muted);
      font-weight:800;
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.6px;
    }
    tr:last-child td{ border-bottom:none; }

    .small{ color:var(--muted); font-size:12px; }

    pre{
      background:#f7f9fb;
      border:1px solid var(--line);
      border-radius:12px;
      padding:12px;
      overflow:auto;
      font:12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      color:#111;
      margin:0;
    }

    @media (max-width: 860px){
      .headline{ font-size:22px; }
    }
  </style>
</head>

<body>
  <div class="wrap">

    <div class="top">
      <div class="brand">
        <div class="logo">GLB</div>
        <h1>Global League Baseball</h1>
      </div>
      <div class="nav">
        <a href="./">Home</a>
        <a href="day.html?date=2026-04-08">Daily Scores</a>
        <a href="teams.html">Teams</a>
      </div>
    </div>

    <div class="card">
      <div class="headline" id="matchup">Loading…</div>
      <p class="sub" id="metaLine"></p>
    </div>

    <div class="card">
      <h2>Final Score</h2>
      <table>
        <thead>
          <tr><th>Team</th><th>R</th></tr>
        </thead>
        <tbody id="scoreRows"></tbody>
      </table>
    </div>

    <div class="card">
      <h2>Box Score</h2>
      <div class="small">(Full inning breakdown will live here.)</div>
    </div>

    <div class="card" id="debugCard" style="display:none;">
      <h2>Debug</h2>
      <div class="small" id="debugLine"></div>
      <pre id="debugPre"></pre>
    </div>

  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const qs = (name) => new URLSearchParams(location.search).get(name);

  async function loadJson(path){
    const url = path + "?v=" + Date.now();
    const res = await fetch(url, { cache: "no-store" });
    if(!res.ok) throw new Error(`HTTP ${res.status} for ${path}`);
    return res.json();
  }

  function pick(obj, keys){
    for(const k of keys){
      if(obj && obj[k] !== undefined && obj[k] !== null) return obj[k];
    }
    return undefined;
  }

  function pickPath(obj, path){
    try{
      return path.split(".").reduce((acc,k)=> (acc && acc[k] !== undefined) ? acc[k] : undefined, obj);
    }catch(e){
      return undefined;
    }
  }

  function toIntOrDash(x){
    const n = Number(x);
    return Number.isFinite(n) ? n : "—";
  }

  function buildTeamsIndex(teamsJson){
    const idx = { bySlug:new Map(), byAbbrev:new Map(), byNameLower:new Map() };
    const list = [];

    if(teamsJson && Array.isArray(teamsJson.teams)) list.push(...teamsJson.teams);
    if(teamsJson && teamsJson.divisions){
      for(const arr of Object.values(teamsJson.divisions)){
        if(Array.isArray(arr)) list.push(...arr);
      }
    }

    for(const t of list){
      const name = t.name || t.team || (t.city && t.nickname ? `${t.city} ${t.nickname}` : undefined);
      const slug = t.slug;
      const abbr = t.abbrev || t.abbr;
      if(name) idx.byNameLower.set(String(name).toLowerCase(), name);
      if(slug && name) idx.bySlug.set(slug, name);
      if(abbr && name) idx.byAbbrev.set(String(abbr).toUpperCase(), name);
    }
    return idx;
  }

  function teamNameFromValue(v, idx){
    if(typeof v === "string"){
      return idx.byNameLower.get(v.toLowerCase()) || v;
    }
    if(v && typeof v === "object"){
      const directName = pick(v, ["name","team","full","display","label"]);
      if(typeof directName === "string"){
        return idx.byNameLower.get(directName.toLowerCase()) || directName;
      }

      const city = pick(v, ["city"]);
      const nick = pick(v, ["nickname","nick"]);
      if(typeof city === "string" && typeof nick === "string"){
        const built = `${city} ${nick}`;
        return idx.byNameLower.get(built.toLowerCase()) || built;
      }

      const slug = pick(v, ["slug"]);
      if(typeof slug === "string" && idx.bySlug.has(slug)) return idx.bySlug.get(slug);

      const abbr = pick(v, ["abbrev","abbr"]);
      if(typeof abbr === "string" && idx.byAbbrev.has(abbr.toUpperCase())) return idx.byAbbrev.get(abbr.toUpperCase());

      const nestedSlug = pickPath(v, "team.slug");
      if(typeof nestedSlug === "string" && idx.bySlug.has(nestedSlug)) return idx.bySlug.get(nestedSlug);

      const nestedAbbr = pickPath(v, "team.abbrev") || pickPath(v, "team.abbr");
      if(typeof nestedAbbr === "string" && idx.byAbbrev.has(nestedAbbr.toUpperCase())) return idx.byAbbrev.get(nestedAbbr.toUpperCase());
    }
    return "—";
  }

  function resolveAwayHome(g){
    const awayTeamVal =
      pick(g, ["away_team","awayTeam","away"]) ||
      pickPath(g, "teams.away") ||
      pickPath(g, "game.away") ||
      pickPath(g, "matchup.away") ||
      pickPath(g, "boxscore.teams.away") ||
      pickPath(g, "boxscore.away");

    const homeTeamVal =
      pick(g, ["home_team","homeTeam","home"]) ||
      pickPath(g, "teams.home") ||
      pickPath(g, "game.home") ||
      pickPath(g, "matchup.home") ||
      pickPath(g, "boxscore.teams.home") ||
      pickPath(g, "boxscore.home");

    return { awayTeamVal, homeTeamVal };
  }

  function resolveScores(g){
    // We try MANY likely places for runs.
    const away =
      pick(g, ["away_score","awayScore","away_runs","awayRuns"]) ??
      pickPath(g, "final.away") ??
      pickPath(g, "final.away_score") ??
      pickPath(g, "score.away") ??
      pickPath(g, "score.away_score") ??
      pickPath(g, "linescore.away.r") ??
      pickPath(g, "linescore.away.R") ??
      pickPath(g, "runs.away") ??
      pickPath(g, "result.away.r") ??
      pickPath(g, "result.away.runs") ??
      pickPath(g, "teams.away.runs") ??
      pickPath(g, "teams.away.R") ??
      pickPath(g, "away.score") ??
      pickPath(g, "boxscore.teams.away.runs") ??
      pickPath(g, "boxscore.teams.away.R") ??
      pickPath(g, "boxscore.linescore.away.r");

    const home =
      pick(g, ["home_score","homeScore","home_runs","homeRuns"]) ??
      pickPath(g, "final.home") ??
      pickPath(g, "final.home_score") ??
      pickPath(g, "score.home") ??
      pickPath(g, "score.home_score") ??
      pickPath(g, "linescore.home.r") ??
      pickPath(g, "linescore.home.R") ??
      pickPath(g, "runs.home") ??
      pickPath(g, "result.home.r") ??
      pickPath(g, "result.home.runs") ??
      pickPath(g, "teams.home.runs") ??
      pickPath(g, "teams.home.R") ??
      pickPath(g, "home.score") ??
      pickPath(g, "boxscore.teams.home.runs") ??
      pickPath(g, "boxscore.teams.home.R") ??
      pickPath(g, "boxscore.linescore.home.r");

    return { away, home };
  }

  function showDebug(line, obj){
    $("debugCard").style.display = "block";
    $("debugLine").textContent = line;
    $("debugPre").textContent = JSON.stringify(obj, null, 2);
  }

  (async function main(){
    try{
      const date = qs("date");
      const game = qs("game");

      if(!date || !game){
        $("matchup").textContent = "Missing query string";
        $("metaLine").textContent = "Use: ?date=YYYY-MM-DD&game=away@home";
        $("scoreRows").innerHTML = "<tr><td colspan='2' class='small'>No game selected.</td></tr>";
        return;
      }

      const gamePath = `data/games/${date}/${game}.json`;

      const [g, teamsJson] = await Promise.all([
        loadJson(gamePath),
        loadJson("data/teams/teams.json")
      ]);

      const idx = buildTeamsIndex(teamsJson);

      const { awayTeamVal, homeTeamVal } = resolveAwayHome(g);
      const awayName = teamNameFromValue(awayTeamVal, idx);
      const homeName = teamNameFromValue(homeTeamVal, idx);

      const { away, home } = resolveScores(g);

      const status = pick(g, ["status","game_status"]) || pickPath(g,"meta.status") || "Final";
      const attendanceRaw = pick(g, ["attendance"]) || pickPath(g,"meta.attendance") || pickPath(g,"game.attendance");
      const attendanceNum = Number(attendanceRaw);
      const attendanceTxt = Number.isFinite(attendanceNum) ? attendanceNum.toLocaleString() : "—";
      const gameDate = pick(g, ["date"]) || pickPath(g,"meta.date") || date;

      $("matchup").textContent = `${awayName} @ ${homeName}`;
      $("metaLine").textContent = `${gameDate} · Attendance ${attendanceTxt} · ${status}`;

      $("scoreRows").innerHTML = `
        <tr><td>${awayName}</td><td>${toIntOrDash(away)}</td></tr>
        <tr><td>${homeName}</td><td>${toIntOrDash(home)}</td></tr>
      `;

      document.title = `GLB — ${awayName} @ ${homeName}`;

      // If scores still missing, show debug so we can map once and be done.
      const awayOk = Number.isFinite(Number(away));
      const homeOk = Number.isFinite(Number(home));
      if(!awayOk || !homeOk){
        showDebug(
          "Runs not found. Your game JSON stores scores under different keys. Here are the values I’m reading:",
          {
            gamePath,
            awayTeamVal,
            homeTeamVal,
            scoreCandidates: {
              away,
              home,
              hint: "Open your game JSON and find where runs live; then we’ll add that path here once."
            }
          }
        );
      }

    }catch(err){
      $("matchup").textContent = "Load failed";
      $("metaLine").textContent = err.message || String(err);
      $("scoreRows").innerHTML = "<tr><td colspan='2' class='small'>Could not load game JSON.</td></tr>";
    }
  })();
</script>

</body>
</html>
