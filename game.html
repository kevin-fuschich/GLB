<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GLB — Game</title>

  <style>
    :root{
      color-scheme: light;
      --bg:#ffffff;
      --card:#ffffff;
      --ink:#111111;
      --muted:#5b6573;
      --line:rgba(17,17,17,.12);
      --max:1100px;
      --radius:18px;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      letter-spacing:.2px;
    }
    a{ color:inherit; text-decoration:none; }
    a:hover{ text-decoration:underline; text-underline-offset:3px; }

    .wrap{ max-width:var(--max); margin:0 auto; padding:28px 18px 56px; }

    .top{
      display:flex; align-items:center; justify-content:space-between;
      gap:18px; margin-bottom:18px;
    }
    .brand{ display:flex; align-items:center; gap:12px; }
    .logo{
      width:38px; height:38px; border-radius:12px;
      border:1px solid var(--line);
      display:grid; place-items:center;
      background:#f4f6f8;
      font-weight:900; letter-spacing:.6px;
    }
    .brand h1{
      font-size:14px; margin:0;
      color:var(--muted);
      font-weight:800;
      letter-spacing:.08em;
    }

    .nav{ display:flex; gap:14px; color:var(--muted); font-size:13px; }
    .nav a{ padding:8px 10px; border-radius:999px; border:1px solid transparent; }
    .nav a:hover{ border-color:var(--line); color:var(--ink); text-decoration:none; }

    .card{
      border:1px solid var(--line);
      background:var(--card);
      border-radius:var(--radius);
      padding:18px;
      margin-bottom:14px;
    }
    .card h2{
      margin:0 0 12px;
      font-size:14px;
      letter-spacing:.7px;
      text-transform:uppercase;
      color:var(--muted);
    }

    .headline{
      font-size:28px;
      font-weight:900;
      margin-bottom:6px;
    }
    .sub{
      color:var(--muted);
      font-size:13px;
      margin-bottom:12px;
    }

    table{
      width:100%;
      border-collapse:collapse;
      font-size:13px;
    }
    th, td{
      padding:9px 8px;
      border-bottom:1px solid var(--line);
      text-align:left;
    }
    th{
      color:var(--muted);
      font-weight:800;
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.6px;
    }
    tr:last-child td{ border-bottom:none; }

    .small{ color:var(--muted); font-size:12px; }

    @media (max-width: 860px){
      .headline{ font-size:22px; }
    }
  </style>
</head>

<body>
  <div class="wrap">

    <div class="top">
      <div class="brand">
        <div class="logo">GLB</div>
        <h1>GLOBAL LEAGUE BASEBALL</h1>
      </div>
      <div class="nav">
        <a href="./">Home</a>
        <a href="day.html?date=2026-04-08">Daily Scores</a>
        <a href="teams.html">Teams</a>
      </div>
    </div>

    <div class="card">
      <div class="headline" id="matchup">Loading…</div>
      <div class="sub" id="metaLine"></div>
    </div>

    <div class="card">
      <h2>Final Score</h2>
      <table>
        <thead>
          <tr><th>Team</th><th>R</th></tr>
        </thead>
        <tbody id="scoreRows"></tbody>
      </table>
    </div>

    <div class="card">
      <h2>Box Score</h2>
      <div class="small">(Full inning breakdown will live here.)</div>
    </div>

  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const qs = (name) => new URLSearchParams(location.search).get(name);

  async function loadJson(path){
    const res = await fetch(path + "?v=" + Date.now(), { cache: "no-store" });
    if(!res.ok) throw new Error("HTTP " + res.status + " for " + path);
    return res.json();
  }

  function pick(obj, keys, fallback){
    for(const k of keys){
      if(obj && obj[k] !== undefined && obj[k] !== null) return obj[k];
    }
    return fallback;
  }

  function num(x){
    const n = Number(x);
    return Number.isFinite(n) ? n : null;
  }

  (async function main(){
    try{
      const date = qs("date");
      const game = qs("game");
      if(!date || !game){
        $("matchup").textContent = "Missing query string";
        $("metaLine").textContent = "Use: ?date=YYYY-MM-DD&game=away@home";
        return;
      }

      const path = `data/games/${date}/${game}.json`;
      const g = await loadJson(path);

      // Support both naming conventions
      const awayName = pick(g, ["away_team", "awayTeam", "away", "away_name"], "—");
      const homeName = pick(g, ["home_team", "homeTeam", "home", "home_name"], "—");

      const awayScore = pick(g, ["away_score", "awayScore"], "—");
      const homeScore = pick(g, ["home_score", "homeScore"], "—");

      const status = pick(g, ["status", "game_status"], "Final");
      const attendanceRaw = pick(g, ["attendance"], null);
      const attendanceNum = num(attendanceRaw);
      const attendanceTxt = attendanceNum !== null ? attendanceNum.toLocaleString() : "—";

      const gameDate = pick(g, ["date", "game_date"], date);

      $("matchup").textContent = `${awayName} @ ${homeName}`;
      $("metaLine").textContent = `${gameDate} · Attendance ${attendanceTxt} · ${status}`;

      $("scoreRows").innerHTML = `
        <tr><td>${awayName}</td><td>${awayScore}</td></tr>
        <tr><td>${homeName}</td><td>${homeScore}</td></tr>
      `;

      document.title = `GLB — ${awayName} @ ${homeName}`;

    }catch(err){
      $("matchup").textContent = "Load failed";
      $("metaLine").textContent = err.message || String(err);
      console.error(err);
    }
  })();
</script>
  <script>
  const $ = (id) => document.getElementById(id);
  const qs = (name) => new URLSearchParams(location.search).get(name);

  async function loadJson(path){
    const res = await fetch(path + "?v=" + Date.now(), { cache: "no-store" });
    if(!res.ok) throw new Error("HTTP " + res.status + " for " + path);
    return res.json();
  }

  function pickPath(obj, path){
    try{
      return path.split(".").reduce((acc,k)=> (acc && acc[k] !== undefined) ? acc[k] : undefined, obj);
    }catch(e){ return undefined; }
  }

  function firstDefined(...vals){
    for(const v of vals){
      if(v !== undefined && v !== null && v !== "") return v;
    }
    return undefined;
  }

  function numOrDash(x){
    const n = Number(x);
    return Number.isFinite(n) ? n : null;
  }

  (async function main(){
    try{
      const date = qs("date");
      const game = qs("game");
      if(!date || !game){
        $("matchup").textContent = "Missing query string";
        $("metaLine").textContent = "Use: ?date=YYYY-MM-DD&game=away@home";
        return;
      }

      const path = `data/games/${date}/${game}.json`;
      const g = await loadJson(path);

      // Try a bunch of likely schemas (flat + nested)
      const awayName = firstDefined(
        g.away_team, g.awayTeam, g.away, g.away_name,
        pickPath(g, "away.team"), pickPath(g, "away.name"),
        pickPath(g, "teams.away.name"), pickPath(g, "teams.away.team"),
        pickPath(g, "matchup.away"), pickPath(g, "game.away.team")
      );

      const homeName = firstDefined(
        g.home_team, g.homeTeam, g.home, g.home_name,
        pickPath(g, "home.team"), pickPath(g, "home.name"),
        pickPath(g, "teams.home.name"), pickPath(g, "teams.home.team"),
        pickPath(g, "matchup.home"), pickPath(g, "game.home.team")
      );

      const awayScore = firstDefined(
        g.away_score, g.awayScore,
        pickPath(g, "away.score"),
        pickPath(g, "teams.away.runs"),
        pickPath(g, "linescore.away.r"),
        pickPath(g, "score.away")
      );

      const homeScore = firstDefined(
        g.home_score, g.homeScore,
        pickPath(g, "home.score"),
        pickPath(g, "teams.home.runs"),
        pickPath(g, "linescore.home.r"),
        pickPath(g, "score.home")
      );

      const status = firstDefined(g.status, g.game_status, pickPath(g,"meta.status")) || "Final";
      const attendanceRaw = firstDefined(g.attendance, pickPath(g,"meta.attendance"), pickPath(g,"game.attendance"));
      const attendanceNum = numOrDash(attendanceRaw);
      const attendanceTxt = attendanceNum !== null ? attendanceNum.toLocaleString() : "—";
      const gameDate = firstDefined(g.date, pickPath(g,"meta.date")) || date;

      // If we still can't resolve names, show schema debug ON PAGE
      if(!awayName || !homeName){
        const keys = Object.keys(g || {}).join(", ");
        $("matchup").textContent = "SCHEMA DEBUG — names not found";
        $("metaLine").textContent = "Top-level keys: " + keys;

        // Put a JSON preview into the scores table so you can copy it
        const preview = JSON.stringify(g, null, 2);
        $("scoreRows").innerHTML = `
          <tr><td colspan="2"><pre style="white-space:pre-wrap;margin:0;font:12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;">${preview.replaceAll("<","&lt;")}</pre></td></tr>
        `;
        return;
      }

      $("matchup").textContent = `${awayName} @ ${homeName}`;
      $("metaLine").textContent = `${gameDate} · Attendance ${attendanceTxt} · ${status}`;

      $("scoreRows").innerHTML = `
        <tr><td>${awayName}</td><td>${awayScore ?? "—"}</td></tr>
        <tr><td>${homeName}</td><td>${homeScore ?? "—"}</td></tr>
      `;

      document.title = `GLB — ${awayName} @ ${homeName}`;

    }catch(err){
      $("matchup").textContent = "Load failed";
      $("metaLine").textContent = err.message || String(err);
      console.error(err);
    }
  })();
</script>
</script>

</body>
</html>
