<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GLB Latest Box Score</title>

<style>
:root{
  --primary:#4A5863;
  --accent:#C0442C;
  --paper:#ffffff;
  --ink:#0f1214;

  --border-thick:4px solid var(--ink);
  --border-thin:1px solid #ccc;

  --sans:"Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono:"Courier New", Courier, monospace;
}

body{
  background:#f4f4f4;
  color:var(--ink);
  font-family:var(--sans);
  margin:0;
  padding:20px;
}

.page{
  max-width:900px;
  margin:0 auto;
  background:var(--paper);
  padding:40px;
  border-top:var(--border-thick);
  position:relative;
}

/* HEADER */
header{
  border-bottom:var(--border-thick);
  padding-bottom:20px;
  margin-bottom:25px;
}

h1{
  margin:0;
  font-size:32px;
  font-weight:900;
  text-transform:uppercase;
}

.subhead{
  margin-top:10px;
  font-family:var(--mono);
  font-size:12px;
  color:#666;
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

/* RETURN BAR */
.returnbar{
  margin:20px 0 35px;
  font-family:var(--mono);
  font-size:11px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.returnbar a{
  color:var(--ink);
  text-decoration:none;
  border-bottom:1px solid rgba(0,0,0,0.25);
}

.returnbar a:hover{
  color:var(--accent);
  border-bottom-color:var(--accent);
}

/* CTA ROW */
.cta-row{
  display:flex;
  gap:10px;
  margin:0 0 30px;
  flex-wrap:wrap;
}

.btn{
  flex:1;
  min-width:180px;
  border:2px solid var(--ink);
  padding:12px 0;
  text-align:center;
  font-size:12px;
  font-weight:bold;
  text-transform:uppercase;
  text-decoration:none;
  color:var(--ink);
}

.btn.primary{
  background:var(--primary);
  color:#fff;
  border-color:var(--primary);
}

.btn:hover{
  color:var(--accent);
  border-color:var(--accent);
}

/* SECTION */
section{margin-bottom:55px;}

h2{
  font-size:14px;
  text-transform:uppercase;
  border-bottom:2px solid var(--accent);
  padding-bottom:5px;
  margin:0 0 15px;
}

/* TABLES */
.table-wrap{
  border-top:var(--border-thin);
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}

thead th{
  text-align:left;
  padding:14px 10px;
  font-family:var(--mono);
  font-size:12px;
  text-transform:uppercase;
  color:#555;
  border-bottom:var(--border-thin);
}

tbody td{
  padding:12px 10px;
  border-bottom:var(--border-thin);
  vertical-align:top;
}

.mono{font-family:var(--mono);}
.right{text-align:right;}
.center{text-align:center;}
.small{font-size:12px;color:#555;}
.note{color:#444;}

.badge{
  display:inline-block;
  font-family:var(--mono);
  font-size:11px;
  padding:3px 8px;
  border:1px solid rgba(0,0,0,0.25);
  border-radius:999px;
  color:#555;
}

/* FOOTER (MATCHES CLUB PAGES) */
footer{
  margin-top:70px;
  padding:30px 20px;
  border-top:var(--border-thick);
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-family:var(--mono);
  font-size:11px;
  color:#777;
}

.glb-logo{
  height:56px;
  width:auto;
}

@media(max-width:600px){
  footer{flex-direction:column; gap:15px;}
}
</style>
</head>

<body>
<div class="page">

<header>
  <h1>Latest Box Score</h1>
  <div class="subhead">
    <span class="badge" id="dateBadge">Date: —</span>
    <span class="badge" id="gameBadge">Game: —</span>
  </div>
</header>

<nav class="returnbar">
  <a href="javascript:history.back()">← Back</a>
  <a href="index.html">Teams Index</a>
  <a id="clubLink" href="index.html">Club Dossier</a>
</nav>

<div class="cta-row">
  <a class="btn primary" id="scoresLink" href="day.html">Daily Scores</a>
  <a class="btn" id="rosterLink" href="team.html">Active Roster</a>
</div>

<section>
  <h2>Linescore</h2>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Team</th>
          <th class="center mono">1</th><th class="center mono">2</th><th class="center mono">3</th><th class="center mono">4</th>
          <th class="center mono">5</th><th class="center mono">6</th><th class="center mono">7</th><th class="center mono">8</th><th class="center mono">9</th>
          <th class="right mono">R</th>
          <th class="right mono">H</th>
          <th class="right mono">E</th>
        </tr>
      </thead>
      <tbody id="linescoreBody">
        <!-- injected -->
      </tbody>
    </table>
  </div>
  <p class="small" id="statusLine"></p>
</section>

<section>
  <h2>Key Notes</h2>
  <div class="table-wrap">
    <table>
      <tbody id="notesBody">
        <!-- injected -->
      </tbody>
    </table>
  </div>
</section>

<section>
  <h2>Batting</h2>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Player</th>
          <th class="right mono">AB</th>
          <th class="right mono">R</th>
          <th class="right mono">H</th>
          <th class="right mono">RBI</th>
          <th class="right mono">BB</th>
          <th class="right mono">K</th>
        </tr>
      </thead>
      <tbody id="battingBody">
        <!-- injected -->
      </tbody>
    </table>
  </div>
</section>

<section>
  <h2>Pitching</h2>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Pitcher</th>
          <th class="right mono">IP</th>
          <th class="right mono">H</th>
          <th class="right mono">R</th>
          <th class="right mono">ER</th>
          <th class="right mono">BB</th>
          <th class="right mono">K</th>
        </tr>
      </thead>
      <tbody id="pitchingBody">
        <!-- injected -->
      </tbody>
    </table>
  </div>
</section>

<footer>
  <div>GLOBAL LEAGUE BASEBALL · BOX SCORE</div>
  <img class="glb-logo" src="GLB_white.png" alt="GLB" />
</footer>

</div>

<script>
/* --------------------------
   Query parsing + defaults
---------------------------*/
const params = new URLSearchParams(window.location.search);

let date = params.get("date");
if (!date) date = new Date().toISOString().slice(0,10);

let game = params.get("game");
if (!game) game = "spokane-alloys@fresno-yield"; // safe default

document.getElementById("dateBadge").textContent = `Date: ${date}`;
document.getElementById("gameBadge").textContent = `Game: ${game}`;

/* --------------------------
   Derive teams from game string
   expected: away@home
---------------------------*/
let away = "unknown";
let home = "unknown";
if (game.includes("@")) {
  const parts = game.split("@");
  away = parts[0] || away;
  home = parts[1] || home;
}

/* --------------------------
   Links that never dead-end
---------------------------*/
document.getElementById("scoresLink").href = `day.html?date=${date}`;
document.getElementById("rosterLink").href = `team.html?team=${home}`;

/* map to club pages (adjust names if yours differ) */
const clubPageByTeam = {
  "spokane-alloys": "club-spokane-alloys.html",
  "albuquerque-aeros": "club-albuquerque-aeros.html",
  "fresno-yield": "club-fresno-yield.html",
  "birmingham-vulcans": "club-birmingham-vulcans.html",
  "vancouver-current": "club-vancouver-current.html",
  "monterrey-cementeros": "club-monterrey-cementeros.html",
  "taipei-neon": "club-taipei-neon.html",
  "tijuana-tecnicos": "club-tijuana-tecnicos.html",
  "st-paul-frost": "club-st-paul-frost.html",
  "san-pedro-cocolos": "club-san-pedro-cocolos.html",
  "santiago-caballeros": "club-santiago-caballeros.html",
  "mayaguez-sultans": "club-mayaguez-sultans.html",
  "toledo-assembly": "club-toledo-assembly.html",
  "durham-gold": "club-durham-gold.html",
  "louisville": "club-louisville.html",
  "osaka-spirits": "club-osaka-spirits.html"
};

const clubLink = document.getElementById("clubLink");
clubLink.href = clubPageByTeam[home] || clubPageByTeam[away] || "index.html";

/* --------------------------
   Minimal “real” page output
   (no “loading” state)
---------------------------*/
function titleCaseSlug(slug){
  return slug.split("-").map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
}

const linescoreBody = document.getElementById("linescoreBody");
linescoreBody.innerHTML = `
  <tr>
    <td><strong>${titleCaseSlug(away)}</strong></td>
    <td class="center mono">0</td><td class="center mono">0</td><td class="center mono">1</td><td class="center mono">0</td>
    <td class="center mono">0</td><td class="center mono">0</td><td class="center mono">0</td><td class="center mono">0</td><td class="center mono">0</td>
    <td class="right mono"><strong>1</strong></td>
    <td class="right mono">5</td>
    <td class="right mono">0</td>
  </tr>
  <tr>
    <td><strong>${titleCaseSlug(home)}</strong></td>
    <td class="center mono">0</td><td class="center mono">0</td><td class="center mono">0</td><td class="center mono">0</td>
    <td class="center mono">1</td><td class="center mono">0</td><td class="center mono">0</td><td class="center mono">0</td><td class="center mono">0</td>
    <td class="right mono"><strong>1</strong></td>
    <td class="right mono">6</td>
    <td class="right mono">1</td>
  </tr>
`;

document.getElementById("statusLine").textContent =
  "Status: Placeholder box score (until game data files are wired).";

/* Notes */
document.getElementById("notesBody").innerHTML = `
  <tr><td class="mono">WP</td><td class="note">TBD</td></tr>
  <tr><td class="mono">LP</td><td class="note">TBD</td></tr>
  <tr><td class="mono">SV</td><td class="note">TBD</td></tr>
  <tr><td class="mono">HR</td><td class="note">None recorded</td></tr>
`;

/* Batting (placeholder) */
document.getElementById("battingBody").innerHTML = `
  <tr><td>${titleCaseSlug(home)} — Team</td><td class="right mono">32</td><td class="right mono">1</td><td class="right mono">6</td><td class="right mono">1</td><td class="right mono">3</td><td class="right mono">7</td></tr>
  <tr><td>${titleCaseSlug(away)} — Team</td><td class="right mono">30</td><td class="right mono">1</td><td class="right mono">5</td><td class="right mono">1</td><td class="right mono">2</td><td class="right mono">8</td></tr>
`;

/* Pitching (placeholder) */
document.getElementById("pitchingBody").innerHTML = `
  <tr><td>${titleCaseSlug(home)} — Staff</td><td class="right mono">9.0</td><td class="right mono">5</td><td class="right mono">1</td><td class="right mono">1</td><td class="right mono">2</td><td class="right mono">8</td></tr>
  <tr><td>${titleCaseSlug(away)} — Staff</td><td class="right mono">9.0</td><td class="right mono">6</td><td class="right mono">1</td><td class="right mono">1</td><td class="right mono">3</td><td class="right mono">7</td></tr>
`;
</script>

</body>
</html>
