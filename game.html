<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GLB — Game</title>

  <style>
    :root{
      color-scheme: light;
      --bg:#ffffff;
      --card:#ffffff;
      --ink:#111111;
      --muted:#5b6573;
      --line:rgba(17,17,17,.12);
      --max:1100px;
      --radius:18px;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      letter-spacing:.2px;
    }
    a{ color:inherit; text-decoration:none; }
    a:hover{ text-decoration:underline; text-underline-offset:3px; }

    .wrap{ max-width:var(--max); margin:0 auto; padding:28px 18px 56px; }

    .top{
      display:flex; align-items:center; justify-content:space-between;
      gap:18px; margin-bottom:18px;
    }
    .brand{ display:flex; align-items:center; gap:12px; }
    .logo{
      width:38px; height:38px; border-radius:12px;
      border:1px solid var(--line);
      display:grid; place-items:center;
      background:#f4f6f8;
      font-weight:900; letter-spacing:.6px;
    }
    .brand h1{
      font-size:14px; margin:0;
      color:var(--muted);
      font-weight:800;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    .nav{ display:flex; gap:14px; color:var(--muted); font-size:13px; }
    .nav a{ padding:8px 10px; border-radius:999px; border:1px solid transparent; }
    .nav a:hover{ border-color:var(--line); color:var(--ink); text-decoration:none; }

    .card{
      border:1px solid var(--line);
      background:var(--card);
      border-radius:var(--radius);
      padding:18px;
      margin-bottom:14px;
    }
    .card h2{
      margin:0 0 12px;
      font-size:14px;
      letter-spacing:.7px;
      text-transform:uppercase;
      color:var(--muted);
    }

    .headline{ font-size:28px; font-weight:900; margin-bottom:6px; }
    .sub{ color:var(--muted); font-size:13px; margin:0; }

    table{ width:100%; border-collapse:collapse; font-size:13px; }
    th, td{ padding:9px 8px; border-bottom:1px solid var(--line); text-align:left; }
    th{ color:var(--muted); font-weight:800; font-size:11px; text-transform:uppercase; letter-spacing:.6px; }
    tr:last-child td{ border-bottom:none; }

    .small{ color:var(--muted); font-size:12px; }

    pre{
      background:#f7f9fb;
      border:1px solid var(--line);
      border-radius:12px;
      padding:12px;
      overflow:auto;
      font:12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      color:#111;
      margin:0;
      white-space:pre-wrap;
      word-break:break-word;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <div class="logo">GLB</div>
        <h1>Global League Baseball</h1>
      </div>
      <div class="nav">
        <a href="./">Home</a>
        <a href="day.html?date=2026-04-08">Daily Scores</a>
        <a href="teams.html">Teams</a>
      </div>
    </div>

    <div class="card">
      <div class="headline" id="matchup">Loading…</div>
      <p class="sub" id="metaLine"></p>
    </div>

    <div class="card">
      <h2>Final Score</h2>
      <table>
        <thead><tr><th>Team</th><th>R</th></tr></thead>
        <tbody id="scoreRows"></tbody>
      </table>
      <div class="small" id="statusLine"></div>
    </div>

    <div class="card">
      <h2>Box Score</h2>
      <div class="small">(Full inning breakdown will live here.)</div>
    </div>

    <div class="card">
      <h2>Debug</h2>
      <pre id="debug"></pre>
    </div>
  </div>

<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const log = (s) => { $("debug").textContent += s + "\n"; };

  function qs(name){
    try { return new URLSearchParams(location.search).get(name); }
    catch(e) { return null; }
  }

  function safeEncodePath(path){
    // Encode only what breaks fetch, preserve slashes.
    // (No decodeURIComponent anywhere — avoids “pattern” errors.)
    return String(path || "")
      .split("/")
      .map(seg => encodeURIComponent(seg))
      .join("/")
      .replace(/%40/g, "@"); // keep @ readable in URLs
  }

  async function fetchJson(path){
    const url = safeEncodePath(path) + "?v=" + Date.now();
    log("Fetching: " + url);
    const res = await fetch(url, { cache: "no-store" });
    log("→ HTTP " + res.status + " " + path);
    if(!res.ok) throw new Error("HTTP " + res.status + " for " + path);
    return res.json();
  }

  function pick(obj, keys){
    for(const k of keys){
      if(obj && obj[k] !== undefined && obj[k] !== null) return obj[k];
    }
    return undefined;
  }
  function pickPath(obj, path){
    try{
      return path.split(".").reduce((acc,k)=> (acc && acc[k] !== undefined) ? acc[k] : undefined, obj);
    }catch(e){ return undefined; }
  }

  function toIntOrDash(x){
    const n = Number(x);
    return Number.isFinite(n) ? n : "—";
  }

  function buildTeamsIndex(teamsJson){
    const idx = { bySlug:new Map(), byAbbrev:new Map(), byNameLower:new Map() };
    const list = [];
    if(teamsJson && Array.isArray(teamsJson.teams)) list.push(...teamsJson.teams);
    if(teamsJson && teamsJson.divisions){
      for(const arr of Object.values(teamsJson.divisions)){
        if(Array.isArray(arr)) list.push(...arr);
      }
    }
    for(const t of list){
      const name = t.name || t.team || (t.city && t.nickname ? (t.city + " " + t.nickname) : undefined);
      const slug = t.slug;
      const abbr = t.abbrev || t.abbr;
      if(name) idx.byNameLower.set(String(name).toLowerCase(), name);
      if(slug && name) idx.bySlug.set(slug, name);
      if(abbr && name) idx.byAbbrev.set(String(abbr).toUpperCase(), name);
    }
    return idx;
  }

  function teamNameFromValue(v, idx){
    if(typeof v === "string") return idx.byNameLower.get(v.toLowerCase()) || v;
    if(v && typeof v === "object"){
      const direct = pick(v, ["name","team","full","display","label"]);
      if(typeof direct === "string") return idx.byNameLower.get(direct.toLowerCase()) || direct;
      const slug = pick(v, ["slug"]);
      if(typeof slug === "string" && idx.bySlug.has(slug)) return idx.bySlug.get(slug);
      const abbr = pick(v, ["abbrev","abbr"]);
      if(typeof abbr === "string" && idx.byAbbrev.has(abbr.toUpperCase())) return idx.byAbbrev.get(abbr.toUpperCase());
    }
    return "—";
  }

  function resolveTeams(g){
    const awayTeamVal =
      pick(g, ["away_team","awayTeam","away"]) ||
      pickPath(g, "teams.away") ||
      pickPath(g, "matchup.away") ||
      pickPath(g, "boxscore.teams.away");

    const homeTeamVal =
      pick(g, ["home_team","homeTeam","home"]) ||
      pickPath(g, "teams.home") ||
      pickPath(g, "matchup.home") ||
      pickPath(g, "boxscore.teams.home");

    return { awayTeamVal, homeTeamVal };
  }

  function resolveRuns(g){
    const away =
      pickPath(g, "final.away") ??
      pickPath(g, "final.away_score") ??
      pick(g, ["away_score","awayScore","away_runs","awayRuns"]) ??
      pickPath(g, "linescore.away.r") ??
      pickPath(g, "score.away");

    const home =
      pickPath(g, "final.home") ??
      pickPath(g, "final.home_score") ??
      pick(g, ["home_score","homeScore","home_runs","homeRuns"]) ??
      pickPath(g, "linescore.home.r") ??
      pickPath(g, "score.home");

    return { away, home };
  }

  async function loadGame(date, gameKey){
    // Style A: ?g=data/games/YYYY-MM-DD/away@home.json  (bulletproof)
    const gParam = qs("g");
    if(gParam){
      return { json: await fetchJson(gParam), pathUsed: gParam };
    }

    // Style B: ?date=YYYY-MM-DD&game=away@home
    if(!date || !gameKey) throw new Error("Missing query string. Use: ?g=data/games/YYYY-MM-DD/away@home.json OR ?date=YYYY-MM-DD&game=away@home");

    // Try exact "@"
    const p1 = "data/games/" + date + "/" + gameKey + ".json";
    // Try literal "%40" filename
    const p2 = "data/games/" + date + "/" + gameKey.replace(/@/g, "%40") + ".json";

    try{
      return { json: await fetchJson(p1), pathUsed: p1 };
    }catch(e1){
      // only fallback on 404
      if(String(e1.message || e1).indexOf("HTTP 404") >= 0){
        return { json: await fetchJson(p2), pathUsed: p2 };
      }
      throw e1;
    }
  }

  async function main(){
    try{
      $("statusLine").textContent = "";
      $("scoreRows").innerHTML = "<tr><td colspan='2' class='small'>Loading…</td></tr>";

      const date = qs("date");
      const gameKey = qs("game");

      log("JS started ✅");
      log("date=" + (date || "—") + " game=" + (gameKey || "—"));
      const teamsJson = await fetchJson("data/teams/teams.json");
      const idx = buildTeamsIndex(teamsJson);

      const { json: g, pathUsed } = await loadGame(date, gameKey);
      log("Loaded game JSON from: " + pathUsed);

      const { awayTeamVal, homeTeamVal } = resolveTeams(g);
      const awayName = teamNameFromValue(awayTeamVal, idx);
      const homeName = teamNameFromValue(homeTeamVal, idx);

      const status = pick(g, ["status"]) || "Final";
      const attendance = pick(g, ["attendance"]) || "—";
      const { away, home } = resolveRuns(g);

      $("matchup").textContent = awayName + " @ " + homeName;

      let attText = attendance;
      const attNum = Number(attendance);
      if(Number.isFinite(attNum)) attText = attNum.toLocaleString();

      $("metaLine").textContent = (g.date || date || "—") + " · Attendance " + attText + " · " + status;

      $("scoreRows").innerHTML =
        "<tr><td>" + awayName + "</td><td>" + toIntOrDash(away) + "</td></tr>" +
        "<tr><td>" + homeName + "</td><td>" + toIntOrDash(home) + "</td></tr>";

      $("statusLine").textContent = "Loaded: " + pathUsed;

      log("DONE ✅");

    }catch(err){
      $("matchup").textContent = "Load failed";
      $("metaLine").textContent = err && err.message ? err.message : String(err);
      $("scoreRows").innerHTML = "<tr><td colspan='2' class='small'>Could not load game JSON.</td></tr>";
      $("statusLine").textContent = "";
      log("ERROR ❌ " + (err && err.message ? err.message : err));
      console.error(err);
    }
  }

  main();
})();
</script>

</body>
</html>
