<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Global League Baseball — League Office Index</title>

<style>
:root{
  --paper:#f1efe9;
  --white:#ffffff;
  --ink:#0e1a22;
  --ink-soft:#2a3a45;
  --line:#c6beb3;
  --mono:ui-monospace, SFMono-Regular, Menlo, monospace;
  --serif:Georgia, "Times New Roman", serif;
  --sans:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

*{box-sizing:border-box;}

body{
  margin:0;
  background:var(--paper);
  font-family:var(--sans);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}

.wrapper{
  max-width:1200px;
  margin:60px auto;
  padding:0 24px;
}

.sheet{
  background:var(--white);
  border-top:6px solid var(--ink);
  box-shadow:0 4px 30px rgba(0,0,0,0.05);
}

header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  padding:32px;
  border-bottom:1px solid var(--line);
}

.header-title{
  font-family:var(--serif);
  font-size:20px;
  font-weight:bold;
  letter-spacing:.5px;
}

.header-sub{
  font-family:var(--mono);
  font-size:12px;
  margin-top:6px;
  color:var(--ink-soft);
}

.header-right img{
  width:60px;
}

.section{
  padding:40px 32px;
  border-bottom:1px solid var(--line);
}

.section h2{
  font-family:var(--mono);
  font-size:12px;
  letter-spacing:2px;
  text-transform:uppercase;
  margin:0 0 20px 0;
  color:var(--ink-soft);
}

/* HERO */

.hero{
  position:relative;
  height:420px;
  overflow:hidden;
  background:#ddd;
}

.hero-slide{
  position:absolute;
  inset:0;
  opacity:0;
  transition:opacity .6s ease;
}

.hero-slide.is-active{
  opacity:1;
}

.hero-img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.hero-overlay{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  background:rgba(10,18,25,0.72);
  color:#fff;
  padding:20px 32px;
}

.hero-overlay h1{
  margin:0 0 6px 0;
  font-family:var(--serif);
  font-size:28px;
}

.hero-overlay p{
  margin:0;
  font-size:14px;
}

.hero-controls{
  position:absolute;
  top:20px;
  right:20px;
  display:flex;
  gap:8px;
  font-family:var(--mono);
  font-size:12px;
}

.hero-controls button{
  border:1px solid var(--line);
  background:rgba(255,255,255,0.75);
  padding:6px 10px;
  cursor:pointer;
}

.hero-counter{
  position:absolute;
  top:20px;
  left:20px;
  font-family:var(--mono);
  font-size:12px;
  background:rgba(255,255,255,0.8);
  padding:6px 10px;
}

/* TODAY */

.games{
  display:grid;
  gap:14px;
}

.game{
  display:flex;
  justify-content:space-between;
  border:1px solid var(--line);
  padding:14px 16px;
  text-decoration:none;
  color:var(--ink);
}

.game:hover{
  background:#faf9f6;
}

.matchup{
  margin:0;
  font-weight:600;
}

.statusline{
  margin:4px 0 0 0;
  font-size:12px;
  color:var(--ink-soft);
}

.score{
  font-weight:bold;
  font-size:18px;
  text-align:right;
}

.time{
  font-size:12px;
  color:var(--ink-soft);
  text-align:right;
}

/* STANDINGS */

table{
  width:100%;
  border-collapse:collapse;
}

th, td{
  padding:8px 10px;
  border-bottom:1px solid var(--line);
  font-size:14px;
}

th{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:1px;
  text-transform:uppercase;
  text-align:left;
}

td.num{
  text-align:right;
  font-variant-numeric:tabular-nums;
}

/* CLUBS */

#clubsGrid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:14px;
}

.club{
  border:1px solid var(--line);
  padding:16px;
  text-decoration:none;
  color:var(--ink);
}

.club:hover{
  background:#faf9f6;
}

.club .name{
  font-weight:bold;
  margin:0 0 6px 0;
}

.club .meta2{
  font-family:var(--mono);
  font-size:11px;
  color:var(--ink-soft);
}

/* FOOTER */

.footer-bar{
  display:flex;
  justify-content:space-between;
  padding:28px 32px;
  font-family:var(--mono);
  font-size:11px;
}

.footer-links a{
  margin-right:12px;
  text-decoration:none;
  color:var(--ink);
}

.footer-links a:hover{
  text-decoration:underline;
}
</style>
</head>
<body>

<div class="wrapper">
<div class="sheet">

<header>
  <div>
    <div class="header-title">League Office Record — Live Index</div>
    <div class="header-sub">
      Updated: <span id="provTime">—</span> ET
    </div>
  </div>
  <div class="header-right">
    <img src="GLB_white.png" alt="GLB Seal">
  </div>
</header>

<!-- HERO -->
<div id="hero" class="hero">
  <div id="heroStage"></div>
  <div id="heroCounter" class="hero-counter">—</div>
  <div class="hero-controls">
    <button id="heroPrev">← Prev</button>
    <button id="heroNext">Next →</button>
  </div>
  <div class="hero-overlay">
    <h1 id="heroTitle">—</h1>
    <p id="heroCaption"></p>
    <div>
      <a id="heroLink" href="#clubs" style="color:#fff;text-decoration:underline;">Explore Clubs →</a>
    </div>
  </div>
</div>

<!-- TODAY -->
<section class="section">
  <h2>Today in GLB</h2>
  <div id="todayDateLabel" style="margin-bottom:12px;font-weight:600;"></div>
  <div id="todayGames" class="games">Loading schedule.</div>
</section>

<!-- STANDINGS -->
<section class="section">
  <h2>Standings</h2>
  <div id="standingsAsOf" style="margin-bottom:14px;"></div>
  <div id="standingsTables">Loading standings.</div>
</section>

<!-- FEATURED -->
<section class="section">
  <h2>Office Memo</h2>
  <div id="featuredBody">Loading memo.</div>
</section>

<!-- CLUBS -->
<section class="section" id="clubs">
  <h2>Club Directory</h2>
  <div id="clubsGrid">Loading clubs.</div>
</section>

<footer class="footer-bar">
  <div>
    GLB CLUB DOSSIER / GLOBAL LEAGUE BASEBALL
    <div class="footer-links">
      <a href="index.html">Home</a>
      <a href="day.html">Daily Scores</a>
      <a href="#clubs">Clubs</a>
    </div>
  </div>
  <div>
    <img src="GLB_white.png" alt="GLB" width="50">
  </div>
</footer>

</div>
</div>

<script src="glb-home.js"></script>
</body>
</html>
