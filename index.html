<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GLB — Documents</title>
<style>
  :root{
    --paper: #ffffff;
    --ink: #002244;
    --meta: #444444;
    --rule: #d0d0d0;
    --serif: "Georgia","Times New Roman",serif;
    --sans: "Helvetica Neue",Helvetica,Arial,sans-serif;
  }

  body{
    margin:0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    -webkit-font-smoothing: antialiased;
  }

  .sheet{
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 22px 70px;
  }

  header{
    display:flex;
    justify-content: space-between;
    align-items: flex-start;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 18px;
  }

  h1{
    margin:0;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }

  .stamp{
    width: 48px;
    height: auto;
    opacity: 0.92;
  }

  .list{
    margin-top: 18px;
  }

  .row{
    display: grid;
    grid-template-columns: 170px 1fr;
    gap: 16px;
    padding: 10px 0;
    border-bottom: 1px solid #eee;
    align-items: baseline;
  }

  .date{
    font-family: var(--sans);
    font-size: 11px;
    color: var(--meta);
    letter-spacing: 0.2px;
    white-space: nowrap;
  }

  .item a{
    color: var(--ink);
    text-decoration: none;
    font-size: 13px;
    line-height: 1.35;
  }

  .item a:hover{
    text-decoration: underline;
  }

  .sub{
    font-family: var(--sans);
    font-size: 11px;
    color: var(--meta);
    margin-top: 3px;
  }

  footer{
    margin-top: 28px;
    font-family: var(--sans);
    font-size: 10px;
    color: var(--meta);
  }

  @media (max-width: 520px){
    .row{
      grid-template-columns: 1fr;
      gap: 6px;
    }
    .date{
      order: 2;
    }
  }
</style>
</head>
<body>

<div class="sheet">
  <header>
    <h1>Documents</h1>
    <!-- Optional. Remove this <img> if you want the index to be seal-free. -->
    <img src="GLB_white.png" alt="GLB Seal" class="stamp" />
  </header>

  <div class="list" aria-label="Document list">
    <div class="row">
      <div class="date">June 18, 2026</div>
      <div class="item">
        <a href="boxscore_stresstest.html">Official Box Score — Monterrey at San Pedro — 14 innings</a>
        <div class="sub">Final 12–10</div>
      </div>
    </div>

    <div class="row">
      <div class="date">June 4, 2026</div>
      <div class="item">
        <a href="boxscore.html">Official Box Score — Monterrey at San Pedro</a>
        <div class="sub">Final 7–1</div>
      </div>
    </div>

    <div class="row">
      <div class="date">(undated)</div>
      <div class="item">
        <a href="health.html">Health</a>
        <div class="sub">System check</div>
      </div>
    </div>

    <!-- Templates (leave or delete) -->
    <div class="row">
      <div class="date">(pending)</div>
      <div class="item">
        <a href="#">Standings — Week 1</a>
        <div class="sub">Not yet published</div>
      </div>
    </div>

    <div class="row">
      <div class="date">(pending)</div>
      <div class="item">
        <a href="#">Schedule — Week 1</a>
        <div class="sub">Not yet published</div>
      </div>
    </div>
  </div>

  <footer>
    GLB records.
  </footer>
</div>

</body>
</html>
