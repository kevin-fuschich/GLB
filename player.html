<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GLB Player File</title>

<style>
:root{
  --navy:#0b1e33;
  --ink:#111;
  --muted:#6b7280;
  --line:#e5e7eb;
  --bg:#f6f7f9;
  --card:#fff;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  color:var(--ink);
  background:var(--bg);
}

header{
  background:var(--navy);
  color:#fff;
  padding:18px 28px;
}

header a{
  color:#fff;
  text-decoration:none;
  margin-right:18px;
  font-size:14px;
}

.brand{
  font-weight:800;
  letter-spacing:.08em;
  margin-bottom:12px;
}

main{
  max-width:1100px;
  margin:40px auto;
  padding:0 24px;
}

.player-card{
  display:grid;
  grid-template-columns:360px 1fr;
  gap:32px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
}

.player-photo{
  background:#dfe3e8;
  min-height:480px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.player-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.player-info{
  padding:36px;
}

.eyebrow{
  text-transform:uppercase;
  letter-spacing:.12em;
  font-size:12px;
  color:var(--muted);
  font-weight:700;
  margin-bottom:12px;
}

h1{
  font-size:44px;
  line-height:1;
  margin:0 0 10px;
}

.club{
  font-size:20px;
  color:var(--muted);
  margin-bottom:28px;
}

.meta{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
  margin:24px 0 32px;
}

.meta-item{
  border-top:1px solid var(--line);
  padding-top:12px;
}

.label{
  font-size:12px;
  text-transform:uppercase;
  color:var(--muted);
  letter-spacing:.08em;
  font-weight:700;
  margin-bottom:5px;
}

.value{
  font-size:18px;
  font-weight:700;
}

section{
  margin-top:34px;
}

h2{
  font-size:22px;
  margin-bottom:12px;
}

p{
  line-height:1.55;
  color:#2f3438;
}

.button-row{
  margin-top:30px;
}

.btn{
  display:inline-block;
  background:var(--navy);
  color:#fff;
  padding:12px 18px;
  border-radius:999px;
  text-decoration:none;
  font-weight:700;
  font-size:14px;
}

.notice{
  background:#fff3cd;
  border:1px solid #ffe08a;
  padding:20px;
  border-radius:12px;
}

@media(max-width:800px){
  .player-card{
    grid-template-columns:1fr;
  }

  .player-photo{
    min-height:360px;
  }

  h1{
    font-size:34px;
  }

  .meta{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">GLB GLOBAL LEAGUE BASEBALL</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="scores.html">Scores</a>
    <a href="standings.html">Standings</a>
    <a href="schedule.html">Schedule</a>
    <a href="teams.html">Teams</a>
    <a href="players.html">Players</a>
    <a href="news.html">News</a>
  </nav>
</header>

<main id="app">
  <div class="notice">Loading player file...</div>
</main>

<script>
/* =========================================================
   GLB PLAYER PAGE
   Reads:
   player.html?team=spokane-alloys&player=kellan-brynden

   Also supports old-style URL:
   player.html?player=kellan-brynden
========================================================= */

const params = new URLSearchParams(window.location.search);
const playerSlug = params.get("player") || "";
let teamSlug = params.get("team") || "";

/* =========================================================
   TEAM CONFIG
========================================================= */

const TEAMS = {
  "spokane-alloys": {
    teamName: "Spokane Alloys",
    cityPrefix: "spokane",
    teamPage: "team.html?team=spokane-alloys"
  },
  "albuquerque-aeros": {
    teamName: "Albuquerque Aeros",
    cityPrefix: "albuquerque",
    teamPage: "team.html?team=albuquerque-aeros"
  }
};

/* =========================================================
   PLAYER INDEX
   Add more players here as needed.
   This lets old URLs without ?team= still work.
========================================================= */

const PLAYER_TEAM_INDEX = {
  "kellan-brynden": "spokane-alloys"
};

/* =========================================================
   PLAYER DATA
   Add details here as you build files out.
========================================================= */

const PLAYERS = {
  "kellan-brynden": {
    name: "Kellan Brynden",
    position: "—",
    age: "—",
    batsThrows: "—",
    status: "Active GLB Player File",
    notes: "Active player file currently under public archive review."
  }
};

/* If team is missing, infer it from player index */
if (!teamSlug && PLAYER_TEAM_INDEX[playerSlug]) {
  teamSlug = PLAYER_TEAM_INDEX[playerSlug];
}

/* Final fallback */
if (!teamSlug) {
  teamSlug = "spokane-alloys";
}

const team = TEAMS[teamSlug];
const player = PLAYERS[playerSlug];

const app = document.getElementById("app");

if (!playerSlug || !player) {
  app.innerHTML = `
    <div class="notice">
      <strong>Player not found.</strong><br>
      Check the player URL slug.
    </div>
  `;
  throw new Error("Player not found");
}

if (!team) {
  app.innerHTML = `
    <div class="notice">
      <strong>Team not found.</strong><br>
      Check the team URL slug.
    </div>
  `;
  throw new Error("Team not found");
}

/* Correct player image path */
const playerImage = `assets/teams/${teamSlug}/images/players/${team.cityPrefix}-${playerSlug}.png`;

document.title = `GLB — ${player.name}`;

app.innerHTML = `
  <article class="player-card">

    <div class="player-photo">
      <img 
        src="${playerImage}" 
        alt="${player.name}, ${team.teamName}"
        onerror="this.parentElement.innerHTML='<div style=&quot;padding:24px;text-align:center;color:#6b7280;&quot;>Player photo not found<br><small>${playerImage}</small></div>';"
      >
    </div>

    <div class="player-info">
      <div class="eyebrow">Official League Record</div>
      <h1>${player.name}</h1>
      <div class="club">${team.teamName}</div>

      <div class="meta">
        <div class="meta-item">
          <div class="label">Position</div>
          <div class="value">${player.position}</div>
        </div>

        <div class="meta-item">
          <div class="label">Age</div>
          <div class="value">${player.age}</div>
        </div>

        <div class="meta-item">
          <div class="label">Bats / Throws</div>
          <div class="value">${player.batsThrows}</div>
        </div>

        <div class="meta-item">
          <div class="label">Club</div>
          <div class="value">${team.teamName}</div>
        </div>
      </div>

      <section>
        <h2>Broadcast & Archive Files</h2>
        <p>${player.status}</p>
      </section>

      <section>
        <h2>Archive Notes</h2>
        <p>${player.notes}</p>
      </section>

      <section>
        <h2>Season Statistics</h2>
        <p>Season statistics file pending.</p>
      </section>

      <div class="button-row">
        <a class="btn" href="${team.teamPage}">View ${team.teamName} →</a>
      </div>
    </div>

  </article>
`;
</script>

</body>
</html>
