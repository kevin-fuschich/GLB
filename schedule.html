<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLB Official Schedule</title>
<link rel="stylesheet" href="scores.css?v=20261114-photo">
<style>
    .record-sheet { --ink-navy:#142333; --meta-grey:#52616b; }
    .record-sheet .score-controls { justify-content:flex-start; align-items:flex-end; }
    .score-controls label { display:grid; gap:6px; font-size:14px; font-weight:bold; }
    .score-controls :is(select,input,button) { min-height:44px; padding:8px 12px; background:white; color:#142333; border:1px solid #cbd2d5; border-radius:3px; }
    .date-group { margin-bottom:28px; }
    .date-header { margin:0; padding:12px 0; border-bottom:2px solid #142333; font-size:1.4rem; letter-spacing:-.025em; }
    .date-group table { background:white; }
    .record-sheet table { width:100%; border-collapse:collapse; table-layout:fixed; font-size:14px; }
    .record-sheet td { padding:14px 8px; border-bottom:1px solid #e9edf1; vertical-align:middle; color:var(--ink-navy); }
    .record-sheet .col-time { width:64px; color:var(--meta-grey); font-size:12px; }
    .record-sheet .col-at { width:32px; color:var(--meta-grey); text-align:center; }
    .record-sheet .col-result { width:72px; text-align:center; font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums; }
    .record-sheet .col-link { width:50px; text-align:right; }
    .record-sheet .col-team-away { text-align:right; }
    .record-sheet .team-page-link { color:var(--ink-navy); text-decoration:none; font-weight:600; overflow-wrap:anywhere; }
    .record-sheet .schedule-box { display:inline-block; padding:8px 0; color:#245978; text-decoration:none; font-size:12px; }
    .record-sheet a:hover { text-decoration:underline; }

    @media(max-width:600px) {
      .record-sheet td { padding:12px 3px; }
      .record-sheet .col-time { width:34px; }
      .record-sheet .col-at { width:16px; }
      .record-sheet .col-result { width:40px; }
      .record-sheet .col-link { width:30px; }
    }
</style>
<link rel="stylesheet" href="site-header.css?v=20261112">
<script defer src="scripts/site-header.js?v=20261114-offseason"></script>
</head>
<body data-season-page="schedule">
<!-- Shared GLB header: generated by scripts/build-site-header.py -->
<header class="site-header" id="glb-site-header">
  <div class="glb-header-bar">
    <a class="glb-header-brand" href="index.html" aria-label="Global League Baseball home"><span class="glb-header-mark">GLB</span><span class="glb-header-name">Global League<br>Baseball</span></a>
    <nav class="glb-header-nav" aria-label="Primary"><a href="index.html">Home</a><a href="scores.html">Scores</a><a href="standings.html">Standings</a><a href="schedule.html" aria-current="page">Schedule</a><a href="teams.html">Teams</a><a href="stats.html">Stats</a><a href="events/donk_championship.html">DONK</a><a href="how-it-works.html">How it works</a><a href="account.html">Account</a><a href="contribute.html" class="glb-header-claim">Claim &amp; Create</a></nav>
    <button id="navToggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mobileMenu">Menu <span aria-hidden="true">☰</span></button>
  </div>
  <nav id="mobileMenu" aria-label="Mobile navigation" hidden><a href="index.html">Home</a><a href="scores.html">Scores</a><a href="standings.html">Standings</a><a href="schedule.html" aria-current="page">Schedule</a><a href="teams.html">Teams</a><a href="stats.html">Stats</a><a href="events/donk_championship.html">DONK</a><a href="how-it-works.html">How it works</a><a href="account.html">Account</a><a href="contribute.html" class="glb-header-claim">Claim &amp; Create</a></nav>
</header>

<main class="scores-page record-sheet">
  <header class="scores-title"><div><p class="eyebrow">Global League Baseball · 2026</p><h1>Official Schedule</h1></div></header>
  <p>Regular season and postseason results</p>
  <section class="score-controls" aria-label="Browse the schedule">
    <label>Month<select id="schedule-month" disabled></select></label>
    <label>Game date<input type="date" id="schedule-date" disabled></label>
    <button type="button" id="full-month" hidden>Show full month</button>
  </section>
  <p id="season-loading">Loading official schedule…</p>
  <p id="schedule-status" role="status"></p>
</main>

  <script>
/* Browser views of the canonical, derived GLB season JSON. */
(() => {
  const $ = selector => document.querySelector(selector);
  const fetchJSON = async file => {
    const response = await fetch(file, { cache: 'no-store' });
    if (!response.ok) throw new Error(`${file}: HTTP ${response.status}`);
    return response.json();
  };
  const dateText = date => new Date(`${date}T12:00:00Z`).toLocaleDateString('en-US', {
    month: 'long', day: 'numeric', year: 'numeric', timeZone: 'UTC'
  });
  const names = new Map();
  const label = slug => names.get(slug) || slug;
  const teamLink = (slug, className) => {
    const a = cell('a', label(slug), className);
    a.href = `team.html?team=${encodeURIComponent(slug)}`;
    return a;
  };
  const boxLink = game => `box.html?date=${encodeURIComponent(game.date)}&game=${encodeURIComponent(`${game.away}@${game.home}`)}`;
  const cell = (tag, value, className) => {
    const el = document.createElement(tag);
    el.textContent = String(value ?? '—');
    if (className) el.className = className;
    return el;
  };
  async function load() {
    const [teams, games, postseason] = await Promise.all([
      fetchJSON('data/teams/teams.json'), fetchJSON('data/season/games.json'), fetchJSON('data/season/postseason-2026.json')
    ]);
    games.push(...postseason.games);
    for (const team of Object.values(teams.divisions).flat()) names.set(team.slug, team.team);
    const sheet = $('.record-sheet');
    $('#season-loading')?.remove();
    const select = $('#schedule-month');
    const picker = $('#schedule-date');
    const reset = $('#full-month');
    const status = $('#schedule-status');
    const dates = games.map(game => game.date).sort();
    if (!dates.length) { status.textContent = 'No games scheduled.'; return; }
    picker.min = dates[0];
    picker.max = dates.at(-1);
    picker.disabled = select.disabled = false;
    const months = [...new Set(games.map(g => g.date.slice(0, 7)))].sort();
    for (const month of months) { const option = document.createElement('option'); option.value = month; option.textContent = new Date(`${month}-01T12:00:00Z`).toLocaleDateString('en-US', {month:'long', year:'numeric', timeZone:'UTC'}); select.append(option); }
    select.value = months.at(-1);
    const list = document.createElement('div');
    function renderMonth() {
      list.replaceChildren();
      const byDate = new Map();
      for (const game of games.filter(g => picker.value ? g.date === picker.value : g.date.startsWith(select.value))) {
        if (!byDate.has(game.date)) byDate.set(game.date, []);
        byDate.get(game.date).push(game);
      }
      reset.hidden = !picker.value;
      const count = [...byDate.values()].reduce((total, slate) => total + slate.length, 0);
      const period = picker.value ? dateText(picker.value) : select.selectedOptions[0].text;
      status.textContent = (count ? count + (count === 1 ? ' game' : ' games') : 'No games scheduled') + ' · ' + period;
      for (const date of [...byDate.keys()].sort()) {
        const slate = byDate.get(date);
        const group = document.createElement('div'); group.className = 'date-group';
        group.append(cell('h2', dateText(date), 'date-header'));
        const table = document.createElement('table');
        const tbody = document.createElement('tbody');
        for (const game of slate) {
          const tr = document.createElement('tr');
          const linkTd = document.createElement('td'); linkTd.className = 'col-link';
          const a = cell('a', 'Box', 'schedule-box'); a.href = boxLink(game); linkTd.append(a);
          const awayTd = document.createElement('td'); awayTd.className = 'col-team col-team-away'; awayTd.append(teamLink(game.away, 'team-page-link'));
          const homeTd = document.createElement('td'); homeTd.className = 'col-team'; homeTd.append(teamLink(game.home, 'team-page-link'));
          tr.append(cell('td', 'Final', 'col-time'), awayTd,
            cell('td', '@', 'col-at'), homeTd,
            cell('td', `${game.awayScore}–${game.homeScore}`, 'col-result'), linkTd);
          tbody.append(tr);
        }
        table.append(tbody); group.append(table); list.append(group);
      }
    }
    function showMonth() { picker.value = ''; renderMonth(); }
    select.addEventListener('change', showMonth);
    reset.addEventListener('click', () => { showMonth(); picker.focus(); });
    picker.addEventListener('change', () => {
      if (!picker.validity.valid) { picker.reportValidity(); return; }
      if (picker.value) {
        const month = picker.value.slice(0, 7);
        if (![...select.options].some(option => option.value === month)) {
          const option = new Option(new Date(month + '-01T12:00:00Z').toLocaleDateString('en-US', {month:'long',year:'numeric',timeZone:'UTC'}), month);
          select.add(option, [...select.options].find(existing => existing.value > month) || null);
        }
        select.value = month;
      }
      renderMonth();
    });
    sheet.append(list);
    renderMonth();
  }
  load().catch(() => {
    $('#season-loading')?.remove();
    $('#schedule-status').textContent = 'The schedule could not be loaded. Refresh to try again.';
  });
})();
</script>
<script src="scripts/glb-ticker.js?v=20261114-offseason"></script>
<script src="scripts/participation.js?v=20261113-members"></script>
</body>
</html>
