<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLB Official Schedule</title>
<style>
    :root { --ink-navy:#0b1e33; --meta-grey:#576576; --line-grey:#dce2e8; --font-serif:Georgia,"Times New Roman",serif; --font-sans:Arial,Helvetica,sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; padding:0; display:block; background:#f2f5f7; color:var(--ink-navy); font:16px/1.5 var(--font-sans); -webkit-font-smoothing:antialiased; }
    .record-sheet { width:calc(100% - 48px); max-width:1000px; margin:36px auto 56px; padding:32px 40px; background:#fff; border:1px solid var(--line-grey); border-top:4px solid var(--ink-navy); border-radius:0 0 10px 10px; box-shadow:0 5px 24px #0b1e3308; }
    .record-sheet > header { display:flex; align-items:center; justify-content:space-between; gap:20px; margin:0 0 26px; padding:0 0 22px; border-bottom:1px solid var(--line-grey); }
    .meta-block { min-width:0; }
    .page-title { margin:0 0 6px; font:700 clamp(26px,4vw,36px)/1.15 var(--font-serif); }
    .meta-detail { color:var(--meta-grey); font-size:14px; }
    .stamp-logo { width:60px; height:auto; flex-shrink:0; }
    .record-sheet .season-controls { margin-bottom:24px; }
    .record-sheet select { max-width:100%; min-height:44px; padding:10px 36px 10px 12px; border:1px solid #bfc9d4; border-radius:6px; background:#fff; color:var(--ink-navy); font:inherit; }
    .date-group { margin-bottom:28px; }
    .date-header { margin:0; padding:0 0 10px; border-bottom:2px solid var(--ink-navy); font:700 18px/1.4 var(--font-serif); }
    .record-sheet table { width:100%; border-collapse:collapse; table-layout:fixed; font-size:14px; }
    .record-sheet td { padding:14px 8px; border-bottom:1px solid #e9edf1; vertical-align:middle; color:var(--ink-navy); }
    .record-sheet .col-time { width:64px; color:var(--meta-grey); font-size:12px; }
    .record-sheet .col-at { width:32px; color:var(--meta-grey); text-align:center; }
    .record-sheet .col-result { width:72px; text-align:center; font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums; }
    .record-sheet .col-link { width:50px; text-align:right; }
    .record-sheet .col-team-away { text-align:right; }
    .record-sheet .team-page-link { color:var(--ink-navy); text-decoration:none; font-weight:600; overflow-wrap:anywhere; }
    .record-sheet .box-link { display:inline-block; padding:8px 0; color:#245978; text-decoration:none; font-size:12px; }
    .record-sheet a:hover { text-decoration:underline; }
    .record-sheet a:focus-visible,.record-sheet select:focus-visible { outline:3px solid #3f9e83; outline-offset:3px; }
    .record-sheet footer { margin-top:36px; padding-top:18px; border-top:1px solid var(--line-grey); color:var(--meta-grey); font-size:12px; }
    @media(max-width:600px) {
        .record-sheet { width:calc(100% - 24px); margin:24px auto 36px; padding:22px 16px; }
        .record-sheet > header { gap:12px; }
        .stamp-logo { width:46px; }
        .meta-detail { font-size:12px; }
        .date-header { font-size:16px; }
        .record-sheet table { font-size:12px; line-height:1.45; }
        .record-sheet td { padding:12px 4px; }
        .record-sheet .col-time { width:38px; font-size:10px; }
        .record-sheet .col-at { width:18px; font-size:10px; }
        .record-sheet .col-result { width:42px; }
        .record-sheet .col-link { width:34px; }
        .record-sheet .box-link { font-size:11px; }
    }
</style>
