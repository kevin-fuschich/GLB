<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLB Official Schedule</title>
<style>
    :root {
        --field-white: #ffffff;
        --ink-navy: #002244;
        --meta-grey: #555555;
        --line-grey: #e0e0e0;
        --font-serif: "Georgia", "Times New Roman", serif;
        --font-sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    body {
        background-color: #f4f4f4;
        font-family: var(--font-sans);
        color: var(--ink-navy);
        display: flex;
        justify-content: center;
        padding: 50px 20px;
        margin: 0;
        -webkit-font-smoothing: antialiased;
    }

    .record-sheet {
        background-color: var(--field-white);
        width: 100%;
        max-width: 580px;
        padding: 40px;
        box-shadow: 0 2px 15px rgba(0,0,0,0.06);
        border-top: 5px solid var(--ink-navy);
    }

    /* HEADER */
    header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 40px;
        border-bottom: 1px solid var(--ink-navy);
        padding-bottom: 20px;
    }

    .meta-block {
        font-family: var(--font-serif);
        font-size: 14px;
        line-height: 1.5;
        color: var(--ink-navy);
    }
    
    .page-title { 
        font-weight: bold; 
        color: var(--ink-navy); 
        font-size: 16px; 
        margin-bottom: 4px; 
        display: block;
    }
    
    .meta-detail { 
        color: var(--meta-grey); 
        font-style: italic;
    }

    .stamp-logo {
        width: 60px;
        height: auto;
        opacity: 0.9;
    }

    /* SCHEDULE LIST */
    .date-group {
        margin-bottom: 25px;
    }

    .date-header {
        font-family: var(--font-serif);
        font-weight: bold;
        font-size: 14px;
        border-bottom: 1px solid var(--ink-navy);
        margin-bottom: 0;
        padding-bottom: 5px;
        color: var(--ink-navy);
        margin-top: 20px;
    }

    .date-group:first-of-type .date-header {
        margin-top: 0;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
        table-layout: fixed;
    }

    /* HEADINGS */
    th {
        text-align: left;
        font-weight: 600; /* Increased weight for archival feel */
        color: var(--meta-grey);
        font-size: 10px;
        padding: 4px 8px;
        border-bottom: 1px solid var(--line-grey);
        text-transform: uppercase;
        letter-spacing: 0.2px; /* Tightened tracking */
    }

    td {
        padding: 10px 8px;
        border-bottom: 1px solid #f0f0f0;
        vertical-align: middle;
        color: #111;
    }

    /* COLUMN SPECIFICS */
    .col-time { width: 70px; color: #555; font-variant-numeric: tabular-nums; }
    .col-at { width: 25px; color: #999; text-align: center; font-size: 11px; }
    .col-result { width: 60px; text-align: center; font-weight: 500; }
    .col-link { width: 40px; text-align: right; }
    
    /* Team Columns */
    .col-team { width: auto; } 
    .col-team-away { text-align: right; }

    /* The "Box" Link */
    a.box-link {
        color: var(--ink-navy);
        text-decoration: none;
        font-size: 11px;
        opacity: 0.7;
        border-bottom: 1px solid transparent;
    }
    
    a.box-link:hover {
        opacity: 1;
        border-bottom: 1px solid var(--ink-navy);
    }

    /* FOOTER */
    footer {
        margin-top: 50px;
        border-top: 1px solid var(--line-grey);
        padding-top: 15px;
        font-size: 10px;
        color: var(--meta-grey);
    }

</style>
</head>
<body data-season-page="schedule">

<div class="record-sheet">
    
    <header>
        <div class="meta-block">
            <span class="page-title">Official Schedule</span>
            <div class="meta-detail">Season 1 · Official Games</div>
        </div>
        <img src="GLB_white.png" alt="GLB Seal" class="stamp-logo">
    </header>
    <p id="season-loading">Loading official schedule…</p>


    <footer>
        Final scores from the official GLB game ledger.
    </footer>

</div>

  <script src="scripts/season-site.js?v=20260913c"></script>
</body>
</html>
