<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GLB — Birmingham Vulcans</title>

<style>
:root{
  --ink:#0f1214;
  --muted:#6b6f75;
  --line:#e1e4e8;
  --bg:#f4f5f6;
  --card:#ffffff;
  --accent:#f15a24;
  --dark:#2e2f33;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
}

body{
  margin:0;
  font-family:var(--sans);
  background:var(--bg);
  color:var(--ink);
}

.container{
  max-width:1100px;
  margin:0 auto;
  padding:30px 20px;
}

h1{
  margin:0;
  font-size:40px;
  font-weight:900;
}

.meta{
  margin-top:8px;
  font-size:13px;
  color:var(--muted);
  text-transform:uppercase;
}

.hero img,
.card img{
  width:100%;
  border:1px solid var(--line);
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:24px;
  margin-top:30px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
}

.card-body{
  padding:16px;
}

.card h3{
  margin:0 0 6px;
  font-size:14px;
  text-transform:uppercase;
}

.card p{
  margin:0;
  font-size:13px;
  color:var(--muted);
}

.links{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:40px;
}

.btn{
  padding:12px 16px;
  border:2px solid var(--ink);
  text-decoration:none;
  font-size:12px;
  font-weight:800;
  text-transform:uppercase;
  color:var(--ink);
}

.btn:hover{
  background:var(--ink);
  color:#fff;
}

.btn.primary{
  background:var(--dark);
  color:#fff;
  border-color:var(--dark);
}

@media(max-width:800px){
  .grid{ grid-template-columns:1fr; }
}
</style>
</head>

<body>

<div class="container">

  <h1>Birmingham Vulcans</h1>
  <div class="meta">Americas Division · OGWA Park</div>

  <!-- HERO -->
  <div class="hero">
    <img src="assets/teams/vancouver-vulcans/park/park1.png">
  </div>

  <!-- GRID -->
  <div class="grid">

    <div class="card">
      <img src="assets/teams/vancouver-vulcans/park/brass-pour.png">
      <div class="card-body">
        <h3>The Pour</h3>
        <p>Core ritual of the park.</p>
      </div>
    </div>

    <div class="card">
      <img src="assets/teams/vancouver-vulcans/park/brass-fans.png">
      <div class="card-body">
        <h3>The Crowd</h3>
        <p>Close, loud, and present.</p>
      </div>
    </div>

    <div class="card">
      <img src="assets/teams/vancouver-vulcans/park/anthem1.png">
      <div class="card-body">
        <h3>Opening Sequence</h3>
        <p>Structured start to every game.</p>
      </div>
    </div>

  </div>

  <!-- LINKS -->
  <div class="links">
    <a class="btn primary" href="team.html?team=birmingham-vulcans">Roster</a>
    <a class="btn" href="club-birmingham-vulcans.html">Club File</a>
  </div>

</div>

</body>
</html>
