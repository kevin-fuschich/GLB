<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GLB — Team</title>

<style>
:root{
  --ink:#0f1214;
  --muted:#6b6f75;
  --line:#e1e4e8;
  --bg:#f4f5f6;
  --card:#ffffff;
  --accent:#1d4f91;
  --dark:#2e2f33;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:var(--sans);
  background:var(--bg);
  color:var(--ink);
}

.container{
  max-width:1100px;
  margin:0 auto;
  padding:30px 20px 50px;
}

.topbar{
  margin-bottom:24px;
}

.back-link{
  display:inline-block;
  margin-bottom:18px;
  font-size:12px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--muted);
  text-decoration:none;
}

.back-link:hover{
  color:var(--ink);
}

h1{
  margin:0;
  font-size:40px;
  font-weight:900;
  line-height:1.02;
}

.meta{
  margin-top:8px;
  font-size:13px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.08em;
}

.hero{
  margin:30px 0;
}

.hero img,
.card img{
  width:100%;
  display:block;
  border:1px solid var(--line);
  background:#ddd;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:24px;
  margin-top:30px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
}

.card-body{
  padding:16px;
}

.card h3{
  margin:0 0 6px;
  font-size:14px;
  text-transform:uppercase;
  letter-spacing:.04em;
}

.card p{
  margin:0;
  font-size:13px;
  color:var(--muted);
  line-height:1.5;
}

.links{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:40px;
}

.btn{
  padding:12px 16px;
  border:2px solid var(--ink);
  text-decoration:none;
  font-size:12px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--ink);
  background:#fff;
}

.btn:hover{
  background:var(--ink);
  color:#fff;
}

.btn.primary{
  background:var(--dark);
  color:#fff;
  border-color:var(--dark);
}

.btn.primary:hover{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
}

.empty{
  padding:28px;
  border:1px solid var(--line);
  background:#fff;
  color:var(--muted);
  font-size:14px;
}

@media (max-width:800px){
  .grid{
    grid-template-columns:1fr;
  }

  h1{
    font-size:32px;
  }
}
</style>
</head>
<body>

<div class="container">
  <div class="topbar">
    <a class="back-link" href="index.html">← Back to GLB</a>
    <h1 id="team-name">Team</h1>
    <div class="meta" id="team-meta">Division · Ballpark</div>
  </div>

  <div id="team-content"></div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const team = params.get("team");

const teams = {
  "birmingham-vulcans": {
    name: "Birmingham Vulcans",
    meta: "Americas Division · OGWA Park",
    hero: {
      src: "assets/teams/birmingham-vulcans/park1.png",
      alt: "park1"
    },
    cards: [
      {
        title: "The Pour",
        body: "Core ritual of the park.",
        src: "assets/teams/birmingham-vulcans/brass-pour.png",
        alt: "brass-pour"
      },
      {
        title: "The Crowd",
        body: "Close, loud, and present.",
        src: "assets/teams/birmingham-vulcans/brass-fans.png",
        alt: "brass-fans"
      },
      {
        title: "Opening Sequence",
        body: "Structured start to every game.",
        src: "assets/teams/birmingham-vulcans/anthem1.png",
        alt: "anthem1"
      }
    ],
    links: [
      {
        label: "Roster",
        href: "team-record-birmingham-vulcans.html",
        primary: true
      },
      {
        label: "Club File",
        href: "club-birmingham-vulcans.html",
        primary: false
      },
      {
        label: "Mascot",
        href: "mascot-brass-vulcan.html",
        primary: false
      }
    ]
  },

  "albuquerque-aeros": {
    name: "Albuquerque Aeros",
    meta: "Americas Division · Propellant Energy Park",
    hero: {
      src: "assets/teams/albuquerque-aeros/park1.png",
      alt: "park1"
    },
    cards: [
      {
        title: "Propellant Energy Park",
        body: "High desert baseball under lift, light, and pressure.",
        src: "assets/teams/albuquerque-aeros/park-gate.png",
        alt: "park-gate"
      },
      {
        title: "Concourse",
        body: "Clay tones, dust, movement, and embedded park identity.",
        src: "assets/teams/albuquerque-aeros/concourse1.png",
        alt: "concourse1"
      },
      {
        title: "Kirk & Burke",
        body: "Balloon mascots built to feel real, weird, and park-native.",
        src: "assets/teams/albuquerque-aeros/kirk-burke-crowd.png",
        alt: "kirk-burke-crowd"
      },
      {
        title: "The Pilot",
        body: "Aviation-era myth rendered as a tactile stadium character.",
        src: "assets/teams/albuquerque-aeros/pilot1.png",
        alt: "pilot1"
      },
      {
        title: "Night Game",
        body: "Moonlight, desert air, and late-game atmosphere.",
        src: "assets/teams/albuquerque-aeros/night-game1.png",
        alt: "night-game1"
      },
      {
        title: "Turkey Sightings",
        body: "There is a turkey in the park. Sightings vary.",
        src: "assets/teams/albuquerque-aeros/turkey1.png",
        alt: "turkey1"
      }
    ],
    links: [
      {
        label: "Club File",
        href: "club-albuquerque-aeros.html",
        primary: true
      },
      {
        label: "Turkey Sightings",
        href: "turkey-sightings.html",
        primary: false
      },
      {
        label: "Park",
        href: "propellant-energy-park.html",
        primary: false
      }
    ]
  }
};

const teamData = teams[team];
const teamNameEl = document.getElementById("team-name");
const teamMetaEl = document.getElementById("team-meta");
const teamContentEl = document.getElementById("team-content");

if (!teamData) {
  document.title = "GLB — Team Not Found";
  teamNameEl.textContent = "Team Not Found";
  teamMetaEl.textContent = "No matching team file";
  teamContentEl.innerHTML = `
    <div class="empty">
      No team configuration exists for this URL parameter.
    </div>
  `;
} else {
  document.title = `GLB — ${teamData.name}`;
  teamNameEl.textContent = teamData.name;
  teamMetaEl.textContent = teamData.meta;

  const cardsHtml = teamData.cards.map(card => `
    <div class="card">
      <img src="${card.src}" alt="${card.alt}">
      <div class="card-body">
        <h3>${card.title}</h3>
        <p>${card.body}</p>
      </div>
    </div>
  `).join("");

  const linksHtml = teamData.links.map(link => `
    <a class="btn${link.primary ? " primary" : ""}" href="${link.href}">${link.label}</a>
  `).join("");

  teamContentEl.innerHTML = `
    <div class="hero">
      <img src="${teamData.hero.src}" alt="${teamData.hero.alt}">
    </div>

    <div class="grid">
      ${cardsHtml}
    </div>

    <div class="links">
      ${linksHtml}
    </div>
  `;
}
</script>

</body>
</html>
