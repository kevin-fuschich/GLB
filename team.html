<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GLB Active Roster</title>

<style>
:root{
  --primary:#4A5863;
  --accent:#C0442C;
  --paper:#ffffff;
  --ink:#0f1214;

  --border-thick:4px solid var(--ink);
  --border-thin:1px solid #ccc;

  --sans:"Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono:"Courier New", Courier, monospace;
}

body{
  background:#f4f4f4;
  color:var(--ink);
  font-family:var(--sans);
  margin:0;
  padding:20px;
}

.page{
  max-width:900px;
  margin:0 auto;
  background:var(--paper);
  padding:40px;
  border-top:var(--border-thick);
  position:relative;
}

/* HEADER */
header{
  border-bottom:var(--border-thick);
  padding-bottom:20px;
  margin-bottom:25px;
}

h1{
  margin:0;
  font-size:32px;
  font-weight:900;
  text-transform:uppercase;
}

.subhead{
  margin-top:10px;
  font-family:var(--mono);
  font-size:12px;
  color:#666;
}

/* RETURN BAR */
.returnbar{
  margin:20px 0 35px;
  font-family:var(--mono);
  font-size:11px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.returnbar a{
  color:var(--ink);
  text-decoration:none;
  border-bottom:1px solid rgba(0,0,0,0.25);
}

.returnbar a:hover{
  color:var(--accent);
  border-bottom-color:var(--accent);
}

/* CTA ROW */
.cta-row{
  display:flex;
  gap:10px;
  margin:0 0 30px;
  flex-wrap:wrap;
}

.btn{
  flex:1;
  min-width:180px;
  border:2px solid var(--ink);
  padding:12px 0;
  text-align:center;
  font-size:12px;
  font-weight:bold;
  text-transform:uppercase;
  text-decoration:none;
  color:var(--ink);
}

.btn.primary{
  background:var(--primary);
  color:#fff;
  border-color:var(--primary);
}

.btn:hover{
  color:var(--accent);
  border-color:var(--accent);
}

/* TABLE */
.table-wrap{
  border-top:var(--border-thin);
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}

thead th{
  text-align:left;
  padding:14px 10px;
  font-family:var(--mono);
  font-size:12px;
  text-transform:uppercase;
  color:#555;
  border-bottom:var(--border-thin);
}

tbody td{
  padding:14px 10px;
  border-bottom:var(--border-thin);
  vertical-align:top;
}

.num, .pos{
  font-family:var(--mono);
  white-space:nowrap;
}

.pos{
  color:var(--accent);
  font-weight:bold;
}

.note{
  color:#444;
}

/* FOOTER (MATCHES CLUB PAGES) */
footer{
  margin-top:70px;
  padding:30px 20px;
  border-top:var(--border-thick);
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-family:var(--mono);
  font-size:11px;
  color:#777;
}

.glb-logo{
  height:56px; /* matches your Spokane template */
  width:auto;
}

@media(max-width:600px){
  footer{flex-direction:column; gap:15px;}
  .cta-row{gap:8px;}
}
</style>
</head>

<body>
<div class="page">

<header>
  <h1>Active Roster</h1>
  <div class="subhead" id="teamLine">Team: —</div>
</header>

<nav class="returnbar">
  <a href="javascript:history.back()">← Back</a>
  <a href="index.html">Teams Index</a>
  <a id="clubLink" href="club-spokane-alloys.html">Club Dossier</a>
</nav>

<div class="cta-row">
  <a class="btn primary" id="dailyLink" href="day.html">Daily Scores</a>
  <a class="btn" id="boxLink" href="game.html">Latest Box Score</a>
</div>

<section class="table-wrap">
  <table>
    <thead>
      <tr>
        <th class="num">#</th>
        <th>Player</th>
        <th class="pos">Pos</th>
        <th class="note">Note</th>
      </tr>
    </thead>
    <tbody id="rosterBody">
      <!-- Rows injected -->
    </tbody>
  </table>
</section>

<footer>
  <div>GLOBAL LEAGUE BASEBALL · ACTIVE ROSTER</div>
  <img class="glb-logo" src="GLB_white.png" alt="GLB" />
</footer>

</div>

<script>
/* --- TEAM PARAM --- */
const params = new URLSearchParams(window.location.search);
let team = params.get("team");

// Default team (prevents “missing query string” behavior)
if (!team) team = "spokane-alloys";

/* --- DATE DEFAULT FOR LINKS --- */
const today = new Date().toISOString().slice(0,10);

/* --- MAP TEAM -> CLUB PAGE ---
   Add entries as you want; unknown teams fall back to index.
*/
const clubPageByTeam = {
  "spokane-alloys": "club-spokane-alloys.html",
  "albuquerque-aeros": "club-albuquerque-aeros.html",
  "fresno-yield": "club-fresno-yield.html",
  "birmingham-vulcans": "club-birmingham-vulcans.html",
  "vancouver-current": "club-vancouver-current.html",
  "monterrey-cementeros": "club-monterrey-cementeros.html",
  "taipei-neon": "club-taipei-neon.html",
  "tijuana-tecnicos": "club-tijuana-tecnicos.html",
  "st-paul-frost": "club-st-paul-frost.html",
  "san-pedro-cocolos": "club-san-pedro-cocolos.html",
  "santiago-caballeros": "club-santiago-caballeros.html",
  "mayaguez-sultans": "club-mayaguez-sultans.html",
  "toledo-assembly": "club-toledo-assembly.html",
  "durham-gold": "club-durham-gold.html",
  "louisville": "club-louisville.html",
  "osaka-spirits": "club-osaka-spirits.html"
};

/* --- TEAM DISPLAY NAME --- */
function titleCaseSlug(slug){
  return slug.split("-").map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
}

document.getElementById("teamLine").textContent = `Team: ${titleCaseSlug(team)}`;

/* --- LINK WIRING --- */
const clubLink = document.getElementById("clubLink");
clubLink.href = clubPageByTeam[team] || "index.html";

document.getElementById("dailyLink").href = `day.html?date=${today}`;
document.getElementById("boxLink").href = `game.html?date=${today}&game=${team}@tbd`;

/* --- ROSTER DATA ---
   Replace later with real rosters.
   For now: stable placeholder per team.
*/
const rosters = {
  "spokane-alloys": [
    { num:"12", name:'Koji "Ice" Tanaka', pos:"P", note:"Quiet tempo. Works fast." },
    { num:"33", name:"B.J. Smelt", pos:"C", note:"Blocks everything. Calls a heavy game." },
    { num:"08", name:"Vince Carbon", pos:"3B", note:"Hard hands. Hard throws." }
  ],
  "albuquerque-aeros": [
    { num:"07", name:'Javi "Throttle" Núñez', pos:"CF", note:"All speed, no apology." },
    { num:"22", name:"Marla Keene", pos:"P", note:"High spin. Likes altitude." },
    { num:"44", name:"DeShawn Pryor", pos:"1B", note:"Big target. Bigger laugh." }
  ],
  "fresno-yield": [
    { num:"05", name:'Speedy "Sprout" Jones', pos:"CF", note:"First step wins." },
    { num:"17", name:"Big Country Vance", pos:"RF", note:"Gap power. Easy stride." },
    { num:"31", name:"Lefty Groves", pos:"P", note:"Smooth motion. Paints corners." }
  ]
};

// Fallback roster if team not listed
const fallbackRoster = [
  { num:"00", name:"Roster Pending", pos:"—", note:"This team will populate once roster files are defined." },
  { num:"00", name:"Roster Pending", pos:"—", note:"Use team=slug in the URL to route correctly." }
];

const list = rosters[team] || fallbackRoster;
const body = document.getElementById("rosterBody");

list.forEach(p => {
  const tr = document.createElement("tr");
  tr.innerHTML = `
    <td class="num">${p.num}</td>
    <td>${p.name}</td>
    <td class="pos">${p.pos}</td>
    <td class="note">${p.note}</td>
  `;
  body.appendChild(tr);
});
</script>

</body>
</html>
