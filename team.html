<style>
  :root{
    color-scheme: light;
    --bg:#ffffff;
    --card:#ffffff;
    --ink:#111111;
    --muted:#5b6573;
    --line:rgba(17,17,17,.12);
    --max:1100px;
    --radius:18px;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    letter-spacing:.2px;
  }

  a{ color:inherit; text-decoration:none; }

  .wrap{
    max-width:var(--max);
    margin:0 auto;
    padding:28px 18px 56px;
  }

  /* Top bar */
  .top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
    margin-bottom:18px;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:12px;
  }

  .logo{
    width:38px;
    height:38px;
    border-radius:999px;
    border:1px solid var(--line);
    display:grid;
    place-items:center;
    background:#f4f6f8;
    font-weight:800;
    letter-spacing:.6px;
  }

  .brand h1{
    font-size:14px;
    margin:0;
    color:var(--muted);
    font-weight:650;
  }

  .nav{
    display:flex;
    gap:14px;
    color:var(--muted);
    font-size:13px;
  }

  .nav a{
    padding:8px 10px;
    border-radius:999px;
    border:1px solid transparent;
  }

  .nav a:hover{
    border-color:var(--line);
    color:var(--ink);
  }

  /* Hero */
  .hero{
    border:1px solid var(--line);
    background:var(--card);
    border-radius:var(--radius);
    padding:22px;
    display:grid;
    grid-template-columns: 1.2fr .8fr;
    gap:18px;
  }

  .kicker{
    color:var(--muted);
    font-size:12px;
    letter-spacing:.8px;
    text-transform:uppercase;
  }

  .teamName{
    margin:8px 0 6px;
    font-size:36px;
    line-height:1.05;
    font-weight:900;
  }

  .metaRow{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:10px;
    color:var(--muted);
    font-size:13px;
  }

  .pill{
    border:1px solid var(--line);
    border-radius:999px;
    padding:7px 10px;
    background:#f7f9fb;
  }

  .statGrid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:10px;
  }

  .stat{
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px;
    background:#f7f9fb;
  }

  .stat .label{
    color:var(--muted);
    font-size:11px;
    letter-spacing:.6px;
    text-transform:uppercase;
  }

  .stat .value{
    font-size:18px;
    font-weight:850;
    margin-top:6px;
  }

  /* Sections */
  .grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:14px;
    margin-top:14px;
  }

  .card{
    border:1px solid var(--line);
    background:var(--card);
    border-radius:var(--radius);
    padding:18px;
  }

  .card h2{
    margin:0 0 12px;
    font-size:14px;
    letter-spacing:.7px;
    text-transform:uppercase;
    color:var(--muted);
  }

  table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
  }

  th, td{
    padding:9px 8px;
    border-bottom:1px solid var(--line);
    text-align:left;
  }

  th{
    color:var(--muted);
    font-weight:700;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.6px;
  }

  tr:last-child td{
    border-bottom:none;
  }

  .coachLine{
    display:flex;
    justify-content:space-between;
    gap:12px;
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }

  .coachLine:last-child{
    border-bottom:none;
  }

  .coachRole{
    color:var(--muted);
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.6px;
  }

  .coachName{
    font-weight:800;
  }

  .small{
    color:var(--muted);
    font-size:12px;
  }

  /* Responsive */
  @media (max-width: 860px){
    .hero{ grid-template-columns:1fr; }
    .grid{ grid-template-columns:1fr; }
    .statGrid{ grid-template-columns: repeat(2, 1fr); }
  }
</style>
