<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GLB — Team</title>

  <style>
    :root{
      color-scheme: light;
      --bg:#ffffff;
      --card:#ffffff;
      --ink:#111111;
      --muted:#5b6573;
      --line:rgba(17,17,17,.12);
      --max:1100px;
      --radius:18px;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      letter-spacing:.2px;
    }
    a{ color:inherit; text-decoration:none; }
    a:hover{ text-decoration:underline; text-underline-offset:3px; }

    .wrap{ max-width:var(--max); margin:0 auto; padding:28px 18px 56px; }

    .top{ display:flex; align-items:center; justify-content:space-between; gap:18px; margin-bottom:18px; }
    .brand{ display:flex; align-items:center; gap:12px; }
    .logo{
      width:38px; height:38px; border-radius:12px;
      border:1px solid var(--line);
      display:grid; place-items:center;
      background:#f4f6f8;
      font-weight:900;
      letter-spacing:.6px;
    }
    .brand h1{ font-size:14px; margin:0; color:var(--muted); font-weight:750; letter-spacing:.08em; }

    .nav{ display:flex; gap:14px; color:var(--muted); font-size:13px; }
    .nav a{ padding:8px 10px; border-radius:999px; border:1px solid transparent; }
    .nav a:hover{ border-color:var(--line); color:var(--ink); text-decoration:none; }

    .hero{
      border:1px solid var(--line);
      background:var(--card);
      border-radius:var(--radius);
      padding:22px;
      display:grid;
      grid-template-columns: 1.2fr .8fr;
      gap:18px;
    }
    .kicker{ color:var(--muted); font-size:12px; letter-spacing:.8px; text-transform:uppercase; }
    .teamName{ margin:8px 0 6px; font-size:36px; line-height:1.05; font-weight:950; }
    .metaRow{ display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; color:var(--muted); font-size:13px; }
    .pill{ border:1px solid var(--line); border-radius:999px; padding:7px 10px; background:#f7f9fb; }

    .statGrid{ display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; }
    .stat{ border:1px solid var(--line); border-radius:14px; padding:12px; background:#f7f9fb; }
    .stat .label{ color:var(--muted); font-size:11px; letter-spacing:.6px; text-transform:uppercase; }
    .stat .value{ font-size:18px; font-weight:900; margin-top:6px; }

    .grid{ display:grid; grid-template-columns: 1fr 1fr; gap:14px; margin-top:14px; }
    .card{ border:1px solid var(--line); background:var(--card); border-radius:var(--radius); padding:18px; }
    .card h2{ margin:0 0 12px; font-size:14px; letter-spacing:.7px; text-transform:uppercase; color:var(--muted); }

    table{ width:100%; border-collapse:collapse; font-size:13px; }
    th, td{ padding:9px 8px; border-bottom:1px solid var(--line); text-align:left; }
    th{ color:var(--muted); font-weight:800; font-size:11px; text-transform:uppercase; letter-spacing:.6px; }
    tr:last-child td{ border-bottom:none; }

    .coachLine{ display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
    .coachLine:last-child{ border-bottom:none; }
    .coachRole{ color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.6px; }
    .coachName{ font-weight:900; }
    .small{ color:var(--muted); font-size:12px; }

    @media (max-width: 860px){
      .hero{ grid-template-columns:1fr; }
      .grid{ grid-template-columns:1fr; }
      .statGrid{ grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <div class="logo">GLB</div>
        <div><h1>GLOBAL LEAGUE BASEBALL</h1></div>
      </div>
      <div class="nav">
        <a href="./">Home</a>
        <a href="day.html?date=2026-04-08">Daily Scores</a>
        <a href="teams.html">Teams</a>
      </div>
    </div>

    <section class="hero">
      <div>
        <div class="kicker">TEAM</div>
        <div class="teamName" id="teamName">Loading…</div>
        <div class="metaRow" id="metaRow"></div>
      </div>

      <div>
        <div class="statGrid">
          <div class="stat">
            <div class="label">Division</div>
            <div class="value" id="divisionVal">—</div>
          </div>
          <div class="stat">
            <div class="label">Abbrev</div>
            <div class="value" id="abbrVal">—</div>
          </div>
          <div class="stat">
            <div class="label">Founded</div>
            <div class="value" id="foundedVal">—</div>
          </div>
        </div>
        <div class="small" id="statusLine">Loading roster…</div>
      </div>
    </section>

    <section class="grid">
      <div class="card">
        <h2>Coaching Staff</h2>
        <div id="coaches"></div>
      </div>

      <div class="card">
        <h2>Roster</h2>
        <table>
          <thead><tr><th>Pos</th><th>Player</th><th>B/T</th><th>Born</th></tr></thead>
          <tbody id="rosterBody"></tbody>
        </table>
      </div>

      <div class="card">
        <h2>Ballpark</h2>
        <div class="small">(Placeholder — we’ll wire this next.)</div>
      </div>

      <div class="card">
        <h2>Identity</h2>
        <div class="small">(Placeholder — logo lockup, colors, mascot, broadcaster, etc.)</div>
      </div>
    </section>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const qs = (name) => new URLSearchParams(location.search).get(name);

    async function loadJson(path){
      const url = path + "?v=" + Date.now();
      const res = await fetch(url, { cache: "no-store" });
      if(!res.ok) throw new Error("HTTP " + res.status + " for " + path);
      return res.json();
    }

    function fmtBT(p){
      const b = p.bats || "—";
      const t = p.throws || "—";
      return (b === "—" && t === "—") ? "—" : `${b}/${t}`;
    }

    function renderCoaches(c){
      if(!c) return "<div class='small'>No coaching data.</div>";
      const map = [
        ["Manager", c.manager],
        ["Pitching Coach", c.pitching_coach],
        ["Hitting Coach", c.hitting_coach]
      ];
      return map.map(([role, obj]) => {
        if(!obj) return "";
        return `
          <div class="coachLine">
            <div>
              <div class="coachRole">${role}</div>
              <div class="coachName">${obj.name}</div>
            </div>
            <div class="small" style="text-align:right;">
              <div>${obj.born || "—"}</div>
              <div>${obj.birthplace || "—"}</div>
            </div>
          </div>
        `;
      }).join("");
    }

    function renderRoster(players){
      const rows = (players || []).map(p => `
        <tr>
          <td>${p.position || "—"}</td>
          <td>${p.name || "—"}</td>
          <td>${fmtBT(p)}</td>
          <td>${p.born || "—"}</td>
        </tr>
      `).join("");
      $("rosterBody").innerHTML = rows || "<tr><td colspan='4' class='small'>No players.</td></tr>";
    }

    function findTeamRecord(teamsJson, slug){
      const divs = (teamsJson && teamsJson.divisions) ? teamsJson.divisions : {};
      for(const [divName, arr] of Object.entries(divs)){
        for(const t of (arr || [])){
          if(t.slug === slug) return { ...t, division: divName };
        }
      }
      return null;
    }

    (async function main(){
      try{
        const slug = qs("team");
        if(!slug){
          $("teamName").textContent = "Missing team parameter";
          $("statusLine").textContent = "Use: team.html?team=vancouver-current";
          return;
        }

        const teams = await loadJson("data/teams/teams.json");
        const rec = findTeamRecord(teams, slug);

        if(!rec){
          $("teamName").textContent = "Team not found";
          $("statusLine").textContent = "No team with slug: " + slug;
          return;
        }

        const displayName = rec.name || rec.team || "—";
        const abbr = rec.abbrev || rec.abbr || "—";

        $("teamName").textContent = displayName;
        $("divisionVal").textContent = rec.division || "—";
        $("abbrVal").textContent = abbr;

        const rosterPath = `data/teams/roster/${slug}.json`;
        const roster = await loadJson(rosterPath);

        $("foundedVal").textContent = roster.founded || "—";

        const pills = [];
        if(roster.city) pills.push(`<div class="pill">${roster.city}</div>`);
        pills.push(`<div class="pill">${abbr}</div>`);
        pills.push(`<div class="pill">${rec.division} Division</div>`);
        $("metaRow").innerHTML = pills.join("");

        $("coaches").innerHTML = renderCoaches(roster.coaches);
        renderRoster(roster.players);

        $("statusLine").textContent = `Loaded: ${rosterPath}`;
        document.title = `GLB — ${displayName}`;
      }catch(err){
        $("teamName").textContent = "Load failed";
        $("statusLine").textContent = (err && err.message) ? err.message : String(err);
        console.error(err);
      }
    })();
  </script>
</body>
</html>
