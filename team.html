<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GLB Team</title>

<style>
:root{
  --ink:#0f1214;
  --muted:#6b6f75;
  --line:#e1e4e8;
  --bg:#f4f5f6;
  --card:#ffffff;
  --navy:#0b1e33;
  --blue:#1d4f91;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:var(--sans);
  background:var(--bg);
  color:var(--ink);
}

a{
  color:inherit;
  text-decoration:none;
}

.container{
  max-width:1100px;
  margin:0 auto;
  padding:30px 20px;
}

/* HEADER */

.site-header{
  background:#0b1e33;
  color:#fff;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.topbar{
  min-height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
  color:#fff;
}

.brand-mark{
  font-weight:800;
  letter-spacing:1.4px;
  font-size:24px;
}

.brand-sub{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1.2px;
  color:#dfe7f1;
}

.nav-links{
  display:flex;
  align-items:center;
  flex:1;
  justify-content:center;
}

.nav-links a{
  color:rgba(255,255,255,.92);
  padding:26px 16px 22px;
  font-size:13px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.8px;
  border-bottom:4px solid transparent;
}

.nav-links a.active{
  border-bottom-color:#7fb0ff;
}

.header-meta{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1px;
  color:#dfe7f1;
}

/* SCORES */

.scores-strip{
  background:#fff;
  border-bottom:1px solid #d9dee5;
}

.scores-row{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
}

.score-cell{
  padding:14px 16px;
  border-right:1px solid #d9dee5;
  color:#111;
}

.score-cell:last-child{
  border-right:none;
}

.score-top{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.7px;
  color:#5f6b7a;
}

.score-status{
  font-weight:700;
  color:#1d4f91;
}

.team-line{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:3px 0;
  font-size:14px;
}

.team-score{
  font-weight:700;
}

/* HERO */

.hero{
  position:relative;
  height:260px;
  border-radius:10px;
  overflow:hidden;
  background:center/cover no-repeat;
  color:#fff;
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      90deg,
      rgba(13,34,53,.88) 0%,
      rgba(13,34,53,.58) 42%,
      rgba(13,34,53,.08) 100%
    );
}

.hero-content{
  position:absolute;
  bottom:20px;
  left:24px;
  right:24px;
  z-index:2;
}

.hero .division{
  font-size:12px;
  letter-spacing:.1em;
  text-transform:uppercase;
  opacity:.8;
}

.hero h1{
  font-size:64px;
  margin:6px 0;
  font-weight:900;
  line-height:.95;
}

.hero p{
  margin:0;
  font-size:14px;
  opacity:.9;
  max-width:620px;
}

/* LAYOUT */

.layout{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:24px;
  margin-top:24px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:10px;
  overflow:hidden;
}

.card h2{
  font-size:16px;
  margin:0;
  padding:16px;
  border-bottom:1px solid var(--line);
}

/* SNAPSHOT */

.snapshot{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  padding:16px;
}

.stat{
  background:#f8f9fa;
  border:1px solid var(--line);
  border-radius:8px;
  padding:12px;
}

.stat small{
  display:block;
  font-size:11px;
  color:var(--muted);
  text-transform:uppercase;
}

.stat strong{
  font-size:20px;
}

/* HISTORY IMAGE */

.history-image-wrap{
  padding:16px;
}

.history-image{
  width:100%;
  height:260px;
  object-fit:cover;
  display:block;
  border-radius:8px;
  border:1px solid var(--line);
  background:#eef1f4;
}

.history-caption{
  margin:10px 0 0;
  font-size:13px;
  line-height:1.45;
  color:var(--muted);
}

/* TABLE */

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:10px;
  border-bottom:1px solid var(--line);
  font-size:13px;
}

th{
  text-align:left;
  color:var(--muted);
  text-transform:uppercase;
  font-size:11px;
}

.player-link{
  font-weight:700;
  color:var(--ink);
}

.player-link:hover{
  text-decoration:underline;
}

.roster-pic{
  width:42px;
  height:42px;
  border-radius:6px;
  object-fit:cover;
  background:#f0f0f0;
}

/* MEDIA */

.media-wrap{
  padding:16px;
  display:grid;
  gap:18px;
}

.media-card{
  border:1px solid var(--line);
  border-radius:10px;
  overflow:hidden;
  background:#fff;
}

.media-photo{
  width:100%;
  height:240px;
  object-fit:cover;
  display:block;
}

.media-info{
  padding:16px;
}

.media-role{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--muted);
  margin-bottom:10px;
}

.media-name{
  font-size:22px;
  font-weight:800;
  margin-bottom:8px;
}

.media-bio{
  font-size:14px;
  line-height:1.5;
  color:#444;
  margin-bottom:14px;
}

.media-status{
  display:inline-block;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.08em;
  padding:6px 10px;
  border-radius:999px;
  background:#eef3f8;
  border:1px solid #d7dfe8;
  margin-bottom:14px;
}

.record-contribution{
  margin-top:14px;
  padding-top:12px;
  border-top:1px solid rgba(0,0,0,.08);
}

.record-id{
  font-family:monospace;
  font-size:11px;
  letter-spacing:.05em;
  opacity:.72;
  margin-bottom:7px;
}

.contribute-link{
  display:inline-block;
  color:#1d4f91;
  font-size:12px;
  font-weight:700;
  letter-spacing:.05em;
  text-transform:uppercase;
  text-decoration:underline;
  text-underline-offset:3px;
}

.contribute-link:hover{
  opacity:.78;
}

.contribute-help{
  margin:8px 0 0;
  font-size:12px;
  line-height:1.45;
  color:#5f6368;
  max-width:420px;
}

/* SIDEBAR */

.sidebar .section{
  padding:16px;
  border-bottom:1px solid var(--line);
}

.sidebar .section:last-child{
  border-bottom:none;
}

.sidebar h3{
  font-size:11px;
  text-transform:uppercase;
  color:var(--muted);
  margin:0 0 6px;
}

.sidebar strong{
  display:block;
  margin-bottom:4px;
}

.sidebar p{
  margin:0;
  font-size:13px;
  color:var(--muted);
  line-height:1.45;
}

.logo-small{
  width:92px;
  height:auto;
  margin-bottom:12px;
}

.ballpark-link{
  display:inline-block;
  margin-top:10px;
  color:#1d4f91;
  font-weight:700;
  font-size:13px;
}

/* MOBILE */

@media(max-width:900px){

  .nav-links,
  .header-meta{
    display:none;
  }

  .scores-row{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .layout{
    grid-template-columns:1fr;
  }
}

@media(max-width:640px){

  .container{
    padding:20px 14px;
  }

  .scores-row{
    grid-template-columns:1fr;
  }

  .score-cell{
    border-right:none;
    border-bottom:1px solid #d9dee5;
  }

  .hero h1{
    font-size:42px;
  }

  .snapshot{
    grid-template-columns:repeat(2,1fr);
  }

  .history-image{
    height:210px;
  }
}
</style>
</head>
