<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GLB — Teams</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 24px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:18px; }
    h1 { font-size: 20px; margin:0; letter-spacing: .04em; }
    nav a { margin-right: 12px; text-decoration:none; }
    .small { color:#666; font-size: 12px; margin: 8px 0 14px; }
    .grid { display:grid; grid-template-columns: 1fr; gap: 18px; }
    @media (min-width: 900px){ .grid { grid-template-columns: 1fr 1fr; } }
    .card { border:1px solid #e5e5e5; border-radius: 12px; padding: 14px; }
    .card h2 { margin: 0 0 10px; font-size: 14px; letter-spacing:.06em; text-transform: uppercase; }
    table { width:100%; border-collapse: collapse; }
    th, td { padding: 10px 8px; border-bottom: 1px solid #eee; text-align:left; font-size: 14px; }
    th { font-size: 12px; color:#666; text-transform: uppercase; letter-spacing:.06em; }
    .right { text-align:right; }
    .debug { white-space: pre-wrap; background:#f7f7f7; border:1px solid #eee; border-radius: 10px; padding: 10px; font-size: 12px; margin-top: 16px; display:none; }
    .status { padding: 8px 10px; border-radius: 10px; font-size: 12px; display:inline-block; }
    .ok { background:#e8f7ee; border:1px solid #bfe7cf; color:#1f6b3a; }
    .bad { background:#fdecec; border:1px solid #f5b5b5; color:#8a1f1f; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>GLOBAL LEAGUE BASEBALL</h1>
      <div class="small">Teams</div>
    </div>
    <nav>
      <a href="./">Home</a>
      <a href="day.html?date=2026-04-08">Daily Scores</a>
      <a href="teams.html">Teams</a>
    </nav>
  </header>

  <div id="status" class="status ok"><span id="statusText">Loading…</span></div>

  <div class="grid" style="margin-top:14px;">
    <section class="card">
      <h2>Pacific</h2>
      <table>
        <thead><tr><th>Team</th><th class="right">Abbrev</th></tr></thead>
        <tbody id="pacificRows"></tbody>
      </table>
    </section>

    <section class="card">
      <h2>Americas</h2>
      <table>
        <thead><tr><th>Team</th><th class="right">Abbrev</th></tr></thead>
        <tbody id="americasRows"></tbody>
      </table>
    </section>
  </div>

  <pre id="debug" class="debug"></pre>

<script>
  const TEAMS_PATH = "data/teams/teams.json";
  const $ = (id) => document.getElementById(id);

  function setStatus(text, ok=true) {
    $("statusText").textContent = text;
    $("status").className = "status " + (ok ? "ok" : "bad");
  }
  function log(line) {
    const d = $("debug");
    d.style.display = "block";
    d.textContent += line + "\\n";
    console.log(line);
  }
  function esc(s){ return String(s||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;"); }

  async function loadJson(path) {
    const url = path + "?v=" + Date.now();
    log("Fetching: " + url);
    const res = await fetch(url, { cache: "no-store" });
    log("→ HTTP " + res.status + " " + path);
    if (!res.ok) throw new Error("HTTP " + res.status + " for " + path);
    return res.json();
  }

  function teamLink(team) {
    return `team.html?team=${encodeURIComponent(team.slug)}`;
  }

  function renderRows(list, targetId) {
    $(targetId).innerHTML = (list || []).map(t => `
      <tr>
        <td><a href="${teamLink(t)}">${esc(t.name)}</a></td>
        <td class="right">${esc(t.abbrev)}</td>
      </tr>
    `).join("");
  }

  (async function main(){
    try {
      setStatus("Loading teams…", true);
      const data = await loadJson(TEAMS_PATH);

      const pac = data.divisions?.Pacific || (data.teams || []).filter(x => x.division === "Pacific");
      const ame = data.divisions?.Americas || (data.teams || []).filter(x => x.division === "Americas");

      renderRows(pac, "pacificRows");
      renderRows(ame, "americasRows");

      setStatus("Loaded.", true);
      log("DONE ✅");
    } catch (e) {
      setStatus("Load failed.", false);
      log("ERROR ❌ " + (e && e.message ? e.message : e));
    }
  })();
</script>
</body>
</html>
